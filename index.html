<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3a40">
<meta name="referrer" content="no-referrer">
<title>CPG HUB</title>
<meta name="application-name" content="CPG HUB">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./work-hub-icon-192.png?v=9f230a65fac4">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=179722669fe6">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* 予定画面を大きく見やすく（v1.20） */
.seg.cv{flex-wrap:nowrap;gap:8px}
.seg.cv button{flex:1;min-height:50px;font-size:18px;border-radius:12px;padding:8px}
.calnav h2{font-size:20px}
.calnav .btn{min-height:44px;min-width:44px;font-size:15px}
.cal{gap:4px}
.cal .wd{font-size:13px}
.cal .d{min-height:86px;font-size:12px;padding:4px}
.cal .n{font-size:15px}
.cal .hn{font-size:10.5px}
.ev{font-size:11.5px;padding:1px 4px}
.wkd{min-height:62px}
.wkd .dn{font-size:24px}
.wkd .dw{font-size:13px}
.hol-name{font-size:13px}
.wkev{font-size:15px}
.wkev .ev{font-size:12.5px}
.wknone{font-size:14px}
.gcst{font-size:13px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
</head>
<body>
<style>
/* Layout: one mobile column (max 720px), sticky header, fixed bottom nav like PAPA HUB; cards only for cases and ToDo rows */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --sunk:#e8eeee; --line:#d3dcdc;
  --fg:#15232b; --muted:#5a6a71; --accent:#0b6b72; --accent-fg:#ffffff; --accent-soft:#dcefef;
  --red:#b93a26; --red-soft:#fbe6e1; --amber:#9a6412; --amber-soft:#f8ecd6; --green:#2d7449; --green-soft:#e0f0e5; --blue:#1d5fb8; --blue-soft:#e3edfb; --gc0:#6a3fa0; --gc0-soft:#efe6f8; --gc1:#a3336b; --gc1-soft:#f9e3ee; --gc2:#3d5a80; --gc2-soft:#e2e9f2; --gc3:#6b6b1f; --gc3-soft:#eeeed8;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172225; --sunk:#1e2c30; --line:#2c3d42;
  --fg:#e3ecee; --muted:#93a6ac; --accent:#4fb8bf; --accent-fg:#06272a; --accent-soft:#163a3d;
  --red:#ef8a76; --red-soft:#3a1d18; --amber:#e3b45f; --amber-soft:#35290f; --green:#7cc896; --green-soft:#16301f; --blue:#86b4f5; --blue-soft:#172a44; --gc0:#c4a3ee; --gc0-soft:#2b2040; --gc1:#f09cc4; --gc1-soft:#3a1a2a; --gc2:#a9c1e0; --gc2-soft:#1d2836; --gc3:#d4d48a; --gc3-soft:#2c2c14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172225; --sunk:#1e2c30; --line:#2c3d42;
  --fg:#e3ecee; --muted:#93a6ac; --accent:#4fb8bf; --accent-fg:#06272a; --accent-soft:#163a3d;
  --red:#ef8a76; --red-soft:#3a1d18; --amber:#e3b45f; --amber-soft:#35290f; --green:#7cc896; --green-soft:#16301f; --blue:#86b4f5; --blue-soft:#172a44; --gc0:#c4a3ee; --gc0-soft:#2b2040; --gc1:#f09cc4; --gc1-soft:#3a1a2a; --gc2:#a9c1e0; --gc2-soft:#1d2836; --gc3:#d4d48a; --gc3-soft:#2c2c14;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.02em}
.brandbox{display:flex;flex-direction:column;line-height:1.1}
.ver{font-size:10px;color:var(--muted);letter-spacing:.02em;margin-top:2px;text-decoration:underline dotted;text-underline-offset:2px}
.proto{font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--amber-soft);color:var(--amber);padding:2px 8px;border-radius:99px}
.top-in .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:720px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:var(--nav-h)}
.nav-in button{border:0;background:none;cursor:pointer;font-weight:700;font-size:11.5px;white-space:nowrap;padding:0;min-width:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.nav-in button[aria-current="page"]{color:var(--accent)}
.nav-in button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav-in .ic{font-size:18px;line-height:1}
.badge{position:absolute;top:6px;right:calc(50% - 26px);background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
.note{font-size:12.5px;color:var(--muted)}
.banner{background:var(--amber-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:13px}
.banner b{color:var(--amber)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-h h2{font-size:17px}
.sec-h .sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile .k{font-size:12px;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--f-display);font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.tile.alert .v{color:var(--red)}
.tile.wide{grid-column:1/-1}
.tile .s{font-size:12.5px;color:var(--muted);font-weight:700}
.tile.alert .s b{color:var(--red)}
.payline{font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap}
.payline .late{color:var(--red);font-weight:700}
.rlist{display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;gap:8px;align-items:center;min-width:0}
.rrow input[type=checkbox]{width:22px;height:22px;flex:none}
.rbody{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.rbody:hover{border-color:var(--accent)}
.cper{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
ul.dl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.ph{position:relative;display:inline-block}
.phx{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--red);font-weight:700;cursor:pointer;line-height:1}
ol.hist{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
ol.hist li{overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.urgent{border-left:5px solid var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.row .sp{flex:1}
.ttl{font-weight:700;min-width:0;overflow-wrap:anywhere}
.chip{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.boss{background:var(--amber-soft);color:var(--amber)}
.card.boss{border-left:4px solid var(--amber)}
.chip.ro{background:var(--blue-soft);color:var(--blue)}
.chip.t-kinkyu{background:var(--red-soft);color:var(--red)}
.chip.t-taikyo{background:var(--accent-soft);color:var(--accent)}
.chip.t-reno{background:var(--amber-soft);color:var(--amber)}
.chip.t-teiki{background:var(--green-soft);color:var(--green)}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.pill.s-won{border-color:var(--green);color:var(--green)}
.pill.s-handed{border-color:var(--accent);color:var(--accent)}
.pill.s-built{border-color:var(--amber);color:var(--amber)}
.pill.s-billed{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.pill.s-billed.late{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.pill.s-paid{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.pill.s-lost{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.pill.s-hold{border-color:var(--amber);color:var(--amber)}
.pill.s-new{border-color:var(--accent);color:var(--accent)}
.due{font-size:12.5px;color:var(--muted)}
.due.over{color:var(--red);font-weight:700}
.due.today{color:var(--amber);font-weight:700}
.since{color:var(--red);font-weight:700;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:42px}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:15px}
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
@media (max-width:520px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.steps span{flex:1;min-width:0;text-align:center;font-size:11.5px;font-weight:700;padding:6px 4px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.steps span.cur{background:var(--accent);color:var(--accent-fg)}
.steps span.end{background:var(--sunk);color:var(--muted);text-decoration:line-through}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto}
table.items{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.items th{text-align:left;font-size:12px;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
table.items td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.items input,table.items select{min-height:36px;padding:5px 8px}
.items-list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-width:0}
.item-h{display:flex;align-items:center;gap:8px}
.item-h h4{margin:0;font-size:14px;font-family:var(--f-display)}
.item-h .sp{flex:1}
.fk{font-size:13px;font-weight:700;color:var(--muted)}
.item.example{background:transparent;border-style:dashed;color:var(--muted)}
.item.example dl.kv+dl.kv{border-top:1px dashed var(--line);padding-top:8px}
.seg.burden button{flex:1;min-height:42px;font-size:14px;border-radius:10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.sum .k{font-size:11.5px;color:var(--muted);font-weight:700}
.sum .v{font-weight:700;font-variant-numeric:tabular-nums}
.ro{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.brk{display:grid;grid-template-columns:7.5em 1fr 3em;gap:8px;align-items:center;font-size:13.5px}
.big{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.calnav{display:flex;align-items:center;gap:8px}
.calnav h2{font-size:17px;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.cal .wd.sun,.cal .d.sun .n,.cal .d.hol .n{color:var(--red)}
.cal .hn{font-size:9.5px;line-height:1.2;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .wd.sat,.cal .d.sat .n{color:var(--blue)}
.cal .d{min-height:70px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px;font-size:11px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.cal .d.sat{background:var(--blue-soft)}
.cal .d.sun,.cal .d.hol{background:var(--red-soft)}
.cal .d.out{opacity:.45}
.cal .d.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .n{font-weight:700;font-variant-numeric:tabular-nums}
.cal .d.today .n{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 6px;align-self:flex-start}
.ev{font-size:10px;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ev.plan{background:var(--accent-soft);color:var(--accent)}
.ev.site{background:var(--green-soft);color:var(--green)}
.ev.quote{background:var(--amber-soft);color:var(--amber)}
.ev.won{background:var(--sunk);color:var(--fg)}
.ev.off{background:var(--red);color:var(--surface);font-weight:900}
.ev.td{color:var(--muted);font-weight:400}
.ev.td.over{color:var(--red);font-weight:700}
.wk{display:flex;flex-direction:column;gap:6px}
.wkrow{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0}
.wkrow.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wkd{border:0;background:var(--sunk);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;line-height:1.2;color:var(--fg);min-height:52px}
.wkd .dn{font-family:var(--f-display);font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.wkd .dw{font-size:11.5px;font-weight:700}
.wkd.sun,.wkd.hol{color:var(--red)}
.hol-name{font-size:12px;font-weight:700;color:var(--red)}
.wkd.sat{color:var(--blue)}
.wkrow.sat{background:var(--blue-soft)}
.wkrow.sun,.wkrow.hol{background:var(--red-soft)}
.wkd.sat,.wkd.sun,.wkd.hol{background:var(--surface)}
.dtitle{border-radius:8px;padding:2px 8px}
.dtitle.sat{background:var(--blue-soft);color:var(--blue)}
.dtitle.sun,.dtitle.hol{background:var(--red-soft);color:var(--red)}
.wkd.today{background:var(--accent);color:var(--accent-fg)}
.wki{display:flex;flex-direction:column;gap:3px;min-width:0;justify-content:center}
.wkev{border:0;background:none;padding:2px 0;text-align:left;cursor:pointer;display:flex;gap:6px;align-items:center;min-width:0;font-size:13px;color:var(--fg)}
.wkev .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkev .ev{font-size:11px;flex:none}
.wkev.td{cursor:default;color:var(--muted)}
.wkev.td.over{color:var(--red);font-weight:700}
.wknone{font-size:12.5px;color:var(--muted)}
.ev.gc0{background:var(--gc0-soft);color:var(--gc0)} .ev.gc1{background:var(--gc1-soft);color:var(--gc1)} .ev.gc2{background:var(--gc2-soft);color:var(--gc2)} .ev.gc3{background:var(--gc3-soft);color:var(--gc3)}
.wkev.gcev{cursor:default}
.card.gccard{cursor:default}
.card.gccard:hover{border-color:var(--line)}
.gcst{margin:0;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gcst .ev{font-size:11px}
.gsync{display:flex;flex-direction:column;gap:6px}
.gsyncbtn{width:100%;min-height:56px;font-size:16px;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:12px}
.gsyncbtn:hover{filter:brightness(1.08)}
.gsyncbtn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.gsyncbtn[disabled]{opacity:.6}
.gres{margin:0;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.gres .ng{color:var(--red)}
.gres .ok{color:var(--green)}
.gres .warn{color:var(--amber);font-weight:700}
.gcals{display:flex;flex-direction:column;gap:6px}
.gcals label{display:flex;gap:8px;align-items:center;font-size:14px}
.gcals input{width:20px;height:20px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
"use strict";
const KEY="workhub_proto_v1";
const TYPES={
  kinkyu:{label:"緊急対応",site:"現地対応"},
  taikyo:{label:"退去立会",site:"立会"},
  reno:{label:"リノベーション",site:"現地調査"},
  teiki:{label:"定期清掃",site:"現地確認"}
};
const STAGES={new:"受付",site:"現地確認済",quoted:"見積提出済",hold:"保留",won:"受注・引渡待ち",handed:"引渡済・施工中",built:"完工・請求待ち",billed:"請求済・入金待ち",paid:"入金済（完了）",lost:"失注"};
const SYMPTOMS=["水漏れ","給湯器凍結","その他"];
const LOSS=["価格","他社に決定","時期が合わない","連絡なし","その他"];
const CLIENT_KINDS=["管理会社","大家さん","その他"];
const STAFF=["黒木","トシ"];
const BURDEN=["家主","入居者","要確認"];

const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);if(!d)return "";d.setDate(d.getDate()+Number(n||0));return ymd(d)};
const todayS=()=>ymd(new Date());
const md=s=>{const d=parseYmd(s);return d?(d.getMonth()+1)+"/"+d.getDate():"—"};
const yen=n=>(n==null||n===""||isNaN(n))?"—":Number(n).toLocaleString("ja-JP")+"円";
const diffDays=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);

/* Stored-data defaults: when a field is added, give it a default here. withDefaults only fills keys that are missing */
const SCHEMA_VERSION=2;
const CASE_DEFAULTS=()=>({addr:"",items:[],note:"",symptom:"",planDate:"",estAmount:null,estSentDate:"",siteDate:"",lossReason:"",lossDate:"",holdDate:"",orderDate:"",jobNo:"",billingTenant:"入居者に直接",handedDate:"",gcal:null,builtDate:"",billDate:"",billAmount:null,billTo:"",payDue:"",payments:[],paidDate:"",payLog:[]});
const TODO_DEFAULTS=()=>({title:"",due:"",tantou:"",done:false});
const RECEIPT_DEFAULTS=()=>({date:"",payee:"",item:"",amount:null,company:"CP",method:"立替",cardId:"",cat:"材料費",caseId:"",site:"",jobNo:"",note:"",photos:[],pext:{},status:"未提出",claimNo:"",submitDate:"",settleDate:"",closeNo:"",createdAt:"",everSub:false,returnedFrom:"",edits:[],drive:{}});
const RSET_DEFAULTS=()=>({name:"",payDays:{CP:2,CPY:4,AT:-1},to:{CP:"桜田",CPY:"桜田",AT:"大須"},useCard:false,cards:[],lastCo:"CP",noSeq:{}});
const DATA_DEFAULTS=()=>({sheetId:"",sheetName:"",lastSync:"",rFolder:"",rShared:false,admin:false,folder:"",listId:"",staff:[],viewListId:"",viewEmail:""});
const SETTINGS_DEFAULTS=()=>({rcpt:RSET_DEFAULTS(),data:DATA_DEFAULTS(),schedule:2,quote:3,reply:14,jobno:1,billAfter:3,payRule:"m1end",acctWait:3,gShow:null,gWrite:""});
const withDefaults=(o,defs)=>{for(const k in defs)if(o[k]===undefined)o[k]=defs[k];return o};
function upgrade(db){
  const obj=x=>x&&typeof x==="object"&&!Array.isArray(x);
  db.cases=db.cases.filter(obj);
  db.cases.forEach(c=>{withDefaults(c,CASE_DEFAULTS());if(!Array.isArray(c.items))c.items=[];if(!Array.isArray(c.payments))c.payments=[];if(!Array.isArray(c.payLog))c.payLog=[]});
  db.todos=(Array.isArray(db.todos)?db.todos:[]).filter(obj);
  db.todos.forEach((t,i)=>{withDefaults(t,TODO_DEFAULTS());if(t.id==null)t.id="T-old"+(i+1)});
  if(!obj(db.settings))db.settings={};
  withDefaults(db.settings,SETTINGS_DEFAULTS());
  /* 領収書 (v1.16): receipts list, receipt numbering and per-person settings, filled in the same way */
  db.receipts=(Array.isArray(db.receipts)?db.receipts:[]).filter(obj);
  db.receipts.forEach(r=>{withDefaults(r,RECEIPT_DEFAULTS());if(!Array.isArray(r.photos))r.photos=[];if(!Array.isArray(r.edits))r.edits=[];if(!obj(r.pext))r.pext={}});
  if(typeof db.rseq!=="number")db.rseq=db.receipts.reduce((m,r)=>Math.max(m,Number(String(r.id).replace(/\D/g,""))||0),0);
  if(!obj(db.settings.rcpt))db.settings.rcpt={};
  const RD=RSET_DEFAULTS();withDefaults(db.settings.rcpt,RD);
  if(!obj(db.settings.rcpt.payDays))db.settings.rcpt.payDays=RD.payDays;else withDefaults(db.settings.rcpt.payDays,RD.payDays);
  if(!obj(db.settings.rcpt.to))db.settings.rcpt.to=RD.to;else withDefaults(db.settings.rcpt.to,RD.to);
  if(!Array.isArray(db.settings.rcpt.cards))db.settings.rcpt.cards=[];
  if(!obj(db.settings.rcpt.noSeq))db.settings.rcpt.noSeq={};
  /* 記録の送り先 (v1.17) */
  if(!obj(db.settings.data))db.settings.data={};
  withDefaults(db.settings.data,DATA_DEFAULTS());
  if(!Array.isArray(db.settings.data.staff))db.settings.data.staff=[];
  db.receipts.forEach(r=>{if(!obj(r.drive))r.drive={}});
  if(typeof db.seq!=="number")db.seq=db.cases.reduce((m,c)=>Math.max(m,Number(String(c.id).replace(/\D/g,""))||0),0);
  /* v2: the sample set was cut to 6 cases; drop the removed samples, but only ones still marked （架空） / （例） so entered data is never touched */
  if(!(db.schemaVersion>=2)){
    const gone=["U-0015","U-0014","U-0013","U-0011","U-0009","U-0006","U-0005","U-0003","U-0002","U-0001"];
    db.cases=db.cases.filter(c=>!(gone.includes(c.id)&&String(c.client).includes("（架空）")));
    db.todos=db.todos.filter(t=>!(t.id==="T2"&&String(t.title).includes("（例）")));
  }
  db.schemaVersion=SCHEMA_VERSION;
  return db;
}

function exSection(){
  const m=ui.exDone?'<p class="note" role="status" style="margin:0">'+h(ui.exDone)+'</p>':'';
  if(!hasExamples())return m?'<section class="sec">'+m+'</section>':'';
  return '<section class="sec"><div class="sec-h"><h2>練習用の例（架空）</h2></div><div class="panel">'+m+
    '<p class="note" style="margin:0">本番の入力を始める前に、練習用の例を消してください。</p>'+
    (ui.exAsk?'<div class="ro" role="alert" style="display:flex;flex-direction:column;gap:8px"><b>（架空）と付いた案件・ToDo・領収書を消します。自分で入力した内容は消えません。</b><div class="row"><button class="btn danger" type="button" data-act="exdo">消す</button><button class="btn" type="button" data-act="exno">やめる</button></div></div>'
      :'<div class="row"><button class="btn danger" type="button" data-act="exask">練習用の例（架空）を消す</button></div>')+'</div></section>';
}
/* A new device starts empty (the practice examples were removed before real use began) */
const emptyDB=()=>({schemaVersion:SCHEMA_VERSION,seq:0,rseq:0,settings:SETTINGS_DEFAULTS(),todos:[],cases:[],receipts:[]});
/* 練習用の例: earlier sample data, recognised by its ID range AND its （架空）/（例） mark, so nothing a person entered is touched */
const numOf=id=>Number(String(id).replace(/\D/g,""))||0;
const fakeMark=x=>String(x||"").includes("（架空）"), exMark=x=>/（例）|\(例\)/.test(String(x||""));
const exCase=c=>/^U-/.test(c.id)&&numOf(c.id)<=16&&fakeMark(c.client)&&fakeMark(c.property);
const exTodo=t=>(t.id==="T1"||t.id==="T2")&&exMark(t.title);
const exReceipt=r=>/^R-/.test(r.id)&&numOf(r.id)<=6&&fakeMark(r.payee);
const exCard=k=>fakeMark(k.name);
const hasExamples=()=>DB.cases.some(exCase)||DB.todos.some(exTodo)||DB.receipts.some(exReceipt)||RS().cards.some(exCard);
function removeExamples(){
  const cs=DB.cases.filter(exCase), rs=DB.receipts.filter(exReceipt), cal=cs.filter(c=>c.gcal&&c.gcal.id).length;
  rs.forEach(r=>r.photos.forEach(k=>photoDel(k).catch(()=>{})));
  cs.forEach(c=>delete photos[c.id]);
  DB.cases=DB.cases.filter(c=>!exCase(c));DB.todos=DB.todos.filter(t=>!exTodo(t));DB.receipts=DB.receipts.filter(r=>!exReceipt(r));
  RS().cards=RS().cards.filter(k=>!exCard(k)||DB.receipts.some(r=>r.cardId===k.id));
  save();
  return {cases:cs.length,receipts:rs.length,cal};
}

let DB;
try{const raw=localStorage.getItem(KEY);DB=raw?JSON.parse(raw):null}catch(e){DB=null}
let upgraded=false;
if(!DB||!Array.isArray(DB.cases))DB=emptyDB();
else{upgraded=DB.schemaVersion!==SCHEMA_VERSION;upgrade(DB)}
/* The failure toast is deferred so it replaces the success toast the same handler shows after save() */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));return true}catch(e){setTimeout(()=>toast("保存できませんでした。端末の空き容量やブラウザの設定を確認してください",6000),0);return false}};
if(upgraded)save();
const photos={};
const ui={view:"home",caseId:null,q:"",type:"all",showEnded:false,tTantou:"all",tPeriod:"week",csv:false,calMonth:todayS().slice(0,7),calDay:todayS(),calView:"month"};

const findCase=id=>allCases().find(c=>c.id===id);
const editCase=id=>{const c=findCase(id);return c&&!c.ro?c:null};
/* 社長の管理端末：「社員の記録を読み込む」で読んだ社員の案件・ToDoを、見るだけの案件として画面にも使う。
   メモリ（ui）だけに持ち、localStorage には残さない（開き直したら読み込み直す） */
const roOn=()=>!!((D().admin||D().viewListId)&&ui.corpRO);
const allCases=()=>roOn()?DB.cases.concat(ui.corpRO):DB.cases;
const roTodos=()=>roOn()?ui.corpTodo:[];
const roHub=()=>new Set(roOn()?ui.corpRO.map(c=>c.srcId):[]);
const typeKeyOf=l=>Object.keys(TYPES).find(k=>TYPES[k].label===l)||"reno";
function roCase(r,x){
  const v=k=>String(r[k]==null?"":r[k]), d=k=>v(k).slice(0,10), num=k=>v(k)===""?null:Number(v(k));
  const stage=STAGES[v("段階キー")]?v("段階キー"):Object.keys(STAGES).find(k=>STAGES[k]===v("段階"))||"new", paid=Number(v("入金済額"))||0;
  return Object.assign(CASE_DEFAULTS(),{ro:true,owner:x.s.name,srcId:v("受付番号"),id:v("受付番号")+"・"+x.s.name,type:typeKeyOf(v("種類")),stage,clientKind:"",client:v("依頼元"),property:v("物件"),room:v("部屋"),tantou:v("担当")||x.s.name,
    receivedAt:v("受付日時")||(d("受付日")?new Date(d("受付日")+"T00:00:00").toISOString():""),planDate:d("予定日"),siteDate:d("実施日"),estAmount:num("見積額"),estSentDate:d("見積提出日"),holdDate:d("保留日"),lossDate:d("失注日"),
    orderDate:d("受注日"),jobNo:v("仕事番号"),handedDate:d("引渡日"),builtDate:d("施工完了日"),billDate:d("請求日"),billAmount:num("請求額"),payDue:d("入金予定日"),payments:paid?[{date:d("入金日")||d("請求日"),amount:paid}]:[],paidDate:stage==="paid"?d("入金日"):""});
}
function roBuild(data){
  const co=ui.corpCo||"all", ok=data.filter(x=>x.ok&&(co==="all"||coList(x.s).includes(co)));
  ui.corpRO=ok.flatMap(x=>x.cases.filter(r=>r["受付番号"]).map(r=>roCase(r,x)));
  ui.corpTodo=ok.flatMap(x=>(x.todo||[]).filter(r=>r["内容"]).map(r=>{const no=String(r["受付番号"]||"");
    return {ro:true,owner:x.s.name,title:String(r["内容"]),due:String(r["期限"]||"").slice(0,10),tantou:String(r["担当"]||x.s.name),kind:String(r["種類"]||""),property:String(r["物件"]||""),room:String(r["部屋"]||""),caseId:no?no+"・"+x.s.name:""}}));
}
/* 見るだけの社員の記録の状態（社長の管理端末だけ） */
function roNote(){
  if(!D().admin&&!D().viewListId)return "";
  if(roOn())return '<p class="note" style="margin:0">社員の記録（見るだけ）：'+md(ymd(new Date(ui.corp.at)))+' '+hm(new Date(ui.corp.at))+'に読み込み</p>';
  return '<div class="banner" role="status">社員の記録はまだ読み込んでいません。ホームの「会社の動き」で <b>社員の記録を読み込む</b> を押すと、ここにも出ます。'+(D().corpAt?'<div class="note">前回の読み込み：'+md(ymd(new Date(D().corpAt)))+' '+hm(new Date(D().corpAt))+'（開き直すと消えるので、読み込み直してください）</div>':'')+'</div>';
}
const roChip=c=>'<span class="chip ro">社員の記録・見るだけ</span>';
const isTaikyo=c=>c.type==="taikyo";
const itemsSum=(c,b)=>c.items.filter(i=>!b||i.burden===b).reduce((s,i)=>s+(Number(i.amount)||0),0);
const estOf=c=>isTaikyo(c)&&c.items.length?itemsSum(c):c.estAmount;
/* A case stays active through 引渡・施工完了・請求 until it is fully paid; only 失注 and 入金済 end it */
const ended=c=>c.stage==="lost"||c.stage==="paid";
const paidSum=c=>(c.payments||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
const remainOf=c=>(Number(c.billAmount)||0)-paidSum(c);
const unpaid=c=>c.stage==="billed"&&remainOf(c)>0;
/* Accounting exchange: a request to 経理 is answered by a 経理連絡 payment record or a "まだ入金なし" reply made on or after it */
const lastReq=c=>(c.payLog||[]).filter(x=>x.kind==="req").map(x=>x.at).sort().pop()||"";
const acctReplied=c=>{const r=lastReq(c);return !r||(c.payLog||[]).some(x=>x.kind==="noPay"&&x.at>=r)||(c.payments||[]).some(x=>x.by==="経理連絡"&&(x.at||x.date)>=r)};
const lateDays=c=>unpaid(c)&&c.payDue&&c.payDue<todayS()?diffDays(todayS(),c.payDue):0;
/* 入金予定日 from 請求日: 翌月末 / 翌々月末 / 30日後 (setting) */
const PAY_RULES={m1end:"請求日の翌月末",m2end:"請求日の翌々月末",d30:"請求日の30日後"};
function payDueOf(bill,rule){const d=parseYmd(bill);if(!d)return "";if(rule==="d30")return addDays(bill,30);return ymd(new Date(d.getFullYear(),d.getMonth()+(rule==="m2end"?3:2),0))}
/* 請求先 default: the client; for 退去立会 with the tenant share billed directly, both payers are named */
function billToDefault(c){
  if(isTaikyo(c)&&c.billingTenant==="入居者に直接"&&itemsSum(c,"入居者")>0)return c.client+"（家主負担 "+yen(itemsSum(c,"家主"))+"）／入居者に直接（入居者負担 "+yen(itemsSum(c,"入居者"))+"）";
  return c.client;
}

function genTodos(){
  const S=DB.settings, out=[];
  for(const c of DB.cases){
    const base={caseId:c.id,tantou:c.tantou,auto:true};
    const rd=c.receivedAt?ymd(new Date(c.receivedAt)):todayS();
    if(c.stage==="new")out.push(Object.assign({},base,c.type==="kinkyu"?{title:"緊急：担当を手配して現地へ向かう",due:rd}:c.planDate?{title:TYPES[c.type].site+"を実施",due:c.planDate}:{title:TYPES[c.type].site+"の日程を調整",due:addDays(rd,S.schedule)}));
    if(c.stage==="site")out.push(Object.assign({},base,{title:"見積書をExcelで作成して提出",due:addDays(c.siteDate||rd,S.quote)}));
    if(c.stage==="quoted")out.push(Object.assign({},base,{title:"受注か失注かを依頼元に確認",due:addDays(c.estSentDate,S.reply)}));
    if(c.stage==="hold")out.push(Object.assign({},base,{title:"保留中の案件を再確認",due:c.holdDate}));
    if(c.stage==="won")out.push(Object.assign({},base,{title:"Accessで現場管理表を作成し、仕事番号を記録",due:addDays(c.orderDate,S.jobno)}));
    if(c.stage==="built")out.push(Object.assign({},base,{title:"請求書を出す",due:addDays(c.builtDate||todayS(),S.billAfter)}));
    if(unpaid(c)&&lastReq(c)&&!acctReplied(c)&&addDays(lastReq(c),S.acctWait)<=todayS())out.push(Object.assign({},base,{title:"経理の返事を確認する（"+md(lastReq(c))+"に入金確認を依頼）",due:addDays(lastReq(c),S.acctWait)}));
    if(lateDays(c))out.push(Object.assign({},base,{title:"入金を確認する（"+lateDays(c)+"日遅れ・残 "+yen(remainOf(c))+"）",due:c.payDue}));
  }
  for(const t of DB.todos)if(!t.done)out.push(Object.assign({manual:true},t));
  rcptNotices().forEach((title,i)=>out.push({id:"rc"+i,title,due:todayS(),tantou:RS().name||"自分",nav:"rcpt"}));
  return out.sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
}
function dueLabel(due){
  if(!due)return '<span class="due">期限なし</span>';
  const n=diffDays(due,todayS());
  if(n<0)return '<span class="due over">'+(-n)+'日超過（'+md(due)+'）</span>';
  if(n===0)return '<span class="due today">今日まで</span>';
  return '<span class="due">'+md(due)+'まで（あと'+n+'日）</span>';
}
function since(iso){
  const m=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000));
  const d=Math.floor(m/1440),hh=Math.floor(m%1440/60),mm=m%60;
  return "受付から"+(d?d+"日":"")+(d||hh?hh+"時間":"")+mm+"分";
}
const typeChip=c=>'<span class="chip t-'+c.type+'">'+TYPES[c.type].label+'</span>';
const stagePill=c=>'<span class="pill s-'+c.stage+(lateDays(c)?" late":"")+'">'+(c.stage==="billed"&&paidSum(c)>0?"一部入金・残あり":STAGES[c.stage])+'</span>';

function caseCard(c){

function stepBar(c){
  const keys=["new","site","quoted","decide","handed","built","billed","paid"], labels=["受付",TYPES[c.type].site,"見積","受注","引渡","完工","請求","入金"];
  const pos={new:0,site:1,quoted:2,hold:2,won:3,lost:3,handed:4,built:5,billed:6,paid:8}[c.stage];
  return '<div class="steps" aria-label="進み具合">'+keys.map((k,i)=>{
    let cls=i<pos?"done":i===pos?"cur":"";
    if(c.stage==="lost"&&i===3)cls="end";
    const lab=i===3&&c.stage==="lost"?"失注":i===2&&c.stage==="hold"?"保留":labels[i];
    return '<span class="'+cls+'">'+lab+'</span>';
  }).join("")+'</div>';
}

  return ['入金確認のお願い（'+md(todayS())+' CPG HUB）','請求済みで、入金がまだ確認できていない案件です。入金があれば、受付番号と入金日・入金額を教えてください。',
    ...list.map((c,i)=>{const paid=paidSum(c),late=lateDays(c);return [
      '',(i+1)+'. '+c.id+' '+c.property+' '+c.room,
      '　請求先：'+c.billTo,
      '　請求額：'+yen(c.billAmount)+(paid?'（入金済 '+yen(paid)+'・残 '+yen(remainOf(c))+'）':'')+'　請求日：'+md(c.billDate),
      '　入金予定日：'+md(c.payDue)+(late?'（'+late+'日遅れ）':'')].join("\n")})].join("\n");
}

  return '<div class="panel"><h3>経理への入金確認の依頼（'+list.length+'件）</h3>'+

    '<p class="note" style="margin:0">送ると、各案件に「経理に確認依頼：'+md(todayS())+'」と記録します。コピーして自分で貼ったときは、送ったあとに<button class="btn sm" type="button" data-act="acctmark" style="margin-left:4px">送ったので記録する</button></p>'+

function acctMark(){
  const list=acctList(), t=todayS();
  for(const c of list)if(!c.payLog.some(x=>x.kind==="req"&&x.at===t))c.payLog.push({kind:"req",at:t});
  ui.acct=false;save();render();toast("経理への確認依頼を記録しました（"+list.length+"件・"+md(t)+"）");
}
/* Payment-related history of a case, oldest first */
function payHistory(c){
  const ev=[];
  if(c.billDate)ev.push([c.billDate,0,"請求 "+yen(c.billAmount)+"（"+c.billTo+"）"]);
  for(const x of c.payLog||[])ev.push([x.at,1,x.kind==="req"?"経理に入金確認を依頼":"経理から返事：まだ入金なし"]);
  for(const x of c.payments||[])ev.push([x.date,2,"入金 "+yen(x.amount)+"（"+(x.by||"区分なし")+(x.at?"・"+md(x.at)+"記録":"")+"）"]);
  if(!ev.length)return "";
  ev.sort((a,b)=>a[0].localeCompare(b[0])||a[1]-b[1]);
  return '<details class="note"'+(ev.length<=6?' open':'')+'><summary>入金についてのやり取り（'+ev.length+'件）</summary><ol class="hist">'+ev.map(e=>'<li><span class="num">'+md(e[0])+'</span> '+h(e[2])+'</li>').join("")+'</ol></details>';
}
/* 施工完了 → 請求 → 入金 (partial payments allowed; 入金済 only when the total reaches the billed amount) */

  const S=DB.settings, t=todayS();
  if(c.stage==="handed")return '<div class="panel"><h3>次にやること：施工完了の記録</h3>'+
    '<label class="f">施工完了日<input type="date" id="d_built" value="'+t+'"><span class="note" data-dl="d_built">'+mdh(t)+'</span></label>'+
    '<div class="row"><button class="btn pri" type="button" data-act="built">施工完了にする</button></div>'+
    '<p class="note" style="margin:0">施工完了から'+S.billAfter+'日で「請求書を出す」のToDoが期限になります。現場が終わっても、入金までが仕事です。</p></div>';
  if(c.stage==="built"){
    const amt=c.billAmount!=null&&c.billAmount!==""?c.billAmount:estOf(c);
    return '<div class="panel"><h3>次にやること：請求</h3>'+
    '<div class="form">'+
    '<label class="f">請求日<input type="date" id="d_bdate" value="'+t+'"></label>'+
    '<label class="f">請求額（税込・円）<input type="number" inputmode="numeric" min="0" id="d_bamt" value="'+h(amt??"")+'"></label>'+
    '<label class="f full">請求先<input type="text" id="d_bto" value="'+h(c.billTo||billToDefault(c))+'"></label>'+
    '<label class="f">入金予定日<input type="date" id="d_pdue" value="'+payDueOf(t,S.payRule)+'"><span class="note" data-dl="d_pdue">'+mdh(payDueOf(t,S.payRule))+'（'+PAY_RULES[S.payRule]+'）</span></label></div>'+
    '<div class="row"><button class="btn pri" type="button" data-act="bill">請求済みにする</button></div>'+
    '<p class="note" style="margin:0">請求額の初期値は'+(isTaikyo(c)&&c.items.length?'立会の箇所の合計':'見積額')+'です。請求書は今までどおり作り、ここには請求した事実を記録します。</p></div>';
  }
  const paid=paidSum(c), rem=remainOf(c), late=lateDays(c);
  const list=(c.payments||[]).map(x=>'<li class="num">'+md(x.date)+'　'+yen(x.amount)+'</li>').join("");
  const sum='<div class="sum"><div><div class="k">請求額</div><div class="v">'+yen(c.billAmount)+'</div></div><div><div class="k">入金済</div><div class="v">'+yen(paid)+'</div></div><div><div class="k">残額</div><div class="v"'+(rem>0&&late?' style="color:var(--red)"':'')+'>'+yen(Math.max(0,rem))+'</div></div></div>';
  if(c.stage==="paid")return '<div class="panel"><h3>入金済み（完了）</h3>'+sum+payHistory(c)+
    (rem<0?'<p class="note" style="margin:0;color:var(--amber)">請求額より '+yen(-rem)+' 多く入金されています。</p>':'')+
    '<div class="row"><button class="btn sm" type="button" data-act="payundo">最後の入金記録を取り消す</button></div></div>';
  return '<div class="panel"><h3>次にやること：入金の確認</h3>'+
    '<p style="margin:0" class="num">入金予定日 '+mdh(c.payDue)+(late?' <b style="color:var(--red)">'+late+'日遅れ</b>':'')+'　請求先 '+h(c.billTo)+'</p>'+

}

/* Deleting a case: only for cases registered by mistake (a cancelled request is 失注). Its 受付番号 is never reused (seq stays) */
function caseDeletePanel(c){
  const linked=DB.receipts.filter(r=>r.caseId===c.id).length, cal=!!(c.gcal&&c.gcal.id);
  const box=x=>'<div class="ro" role="alert" style="display:flex;flex-direction:column;gap:8px">'+x+'</div>';
  if(linked)return box('<b style="color:var(--red)">この案件に紐づいた領収書が'+linked+'件あります。先に領収書の案件の紐づけを外してください。</b><div class="row"><button class="btn" type="button" data-act="cdelno">閉じる</button></div>');
  return box('<b style="color:var(--red)">'+h(c.id)+'（'+h(c.property)+' '+h(c.room)+'）を削除します。元に戻せません。</b><span>間違えて登録した案件のときだけ使ってください。依頼が無くなった場合は「失注」にしてください。</span>'+
    (cal?'<label class="row"><input type="checkbox" id="cdel_gcal"'+(ui.cdelCal!==false?' checked':'')+'> Googleカレンダーの予定も削除する</label>'+
      (ui.cdelCal!==false&&!gSignedIn()?'<span class="note" style="color:var(--amber)">Googleにログインしていません。カレンダーの予定も消すときは、「Googleとまとめて同期」でログインしてから削除してください。チェックを外すと、カレンダーの予定を残して案件だけ削除します。</span>':''):'')+
    (ui.cdelMsg?'<span style="color:var(--red)">'+h(ui.cdelMsg)+'</span>':'')+
    '<div class="row"><button class="btn danger" type="button" data-act="cdeldo"'+(ui.cdelBusy?' disabled':'')+'>'+(ui.cdelBusy?'削除しています…':'削除する')+'</button><button class="btn" type="button" data-act="cdelno">やめる</button></div>');
}
function caseDelete(c){
  DB.cases=DB.cases.filter(x=>x!==c);delete photos[c.id];
  save();go("cases");toast(c.id+"を削除しました");
}

function vTodo(){
  const t=todayS(), wk=addDays(t,7);
  const ro=roTodos(), tans=[...new Set(STAFF.concat(ro.map(x=>x.tantou)))];
  let list=genTodos().concat(ro).filter(x=>x.order||ui.tTantou==="all"||x.tantou===ui.tTantou); /* タスクリクエスト is always shown */
  if(ui.tPeriod==="today")list=list.filter(x=>x.order||x.due&&x.due<=t);
  if(ui.tPeriod==="week")list=list.filter(x=>x.order||x.due&&x.due<=wk);
  const seg=(id,cur,opts)=>'<div class="seg" role="group">'+opts.map(([k,l])=>'<button type="button" data-'+id+'="'+k+'" aria-pressed="'+(cur===k)+'">'+l+'</button>').join("")+'</div>';
  return '<section class="sec"><div class="sec-h"><h2>ToDo</h2><span class="note num">'+list.length+'件</span></div>'+
  seg("tp",ui.tPeriod,[["today","今日まで"],["week","1週間以内"],["all","すべて"]])+
  seg("tt",ui.tTantou,[["all","全員"],...tans.map(s=>[s,s])])+roNote()+
  '<p class="note" style="margin:0">案件のToDoは段階に合わせて自動で出ます。案件を進めると消えます。</p>'+
  '<div class="list">'+(list.map(todoRow).join("")||'<div class="empty">この条件のToDoはありません</div>')+'</div></section>'+
  '<section class="panel"><h3>ToDoを手で追加</h3><form id="todoForm" class="form">'+
    '<label class="f full">内容<input type="text" id="td_title" required placeholder="例：管理会社へ挨拶まわり"></label>'+
    '<label class="f">期限<input type="date" id="td_due" value="'+t+'"></label>'+
    '<label class="f">担当<select id="td_tantou">'+STAFF.map(s=>'<option>'+s+'</option>').join("")+'</select></label>'+
    '<div class="full"><button class="btn pri" type="submit">追加する</button></div></form></section>';
}

function vGantt(){
  const DAYS=29, W=26, from=addDays(todayS(),-14), t=todayS();
  const x=s=>Math.max(0,Math.min(DAYS,diffDays(s,from)));
  const todos=genTodos().concat(roTodos());
  const order={new:0,site:1,quoted:2,hold:3,won:4,handed:5,built:6,billed:7};
  const act=allCases().filter(c=>!ended(c)), tans=[...new Set(act.map(c=>c.tantou||"未設定"))];
  if(ui.gTantou&&ui.gTantou!=="all"&&!tans.includes(ui.gTantou))ui.gTantou="all";
  const list=act.filter(c=>!ui.gTantou||ui.gTantou==="all"||(c.tantou||"未設定")===ui.gTantou).sort((a,b)=>(b.type==="kinkyu")-(a.type==="kinkyu")||order[a.stage]-order[b.stage]||a.id.localeCompare(b.id));
  const seg=(a,b,cls)=>{if(!a)return "";const L=x(a),R=b===t?x(b)+1:x(b);if(R<=0||L>=DAYS)return "";return '<span class="gseg '+cls+'" style="left:'+(L*W)+'px;width:'+Math.max(4,(R-L)*W)+'px"></span>'};
  let head="";
  for(let i=0;i<DAYS;i++){const d=parseYmd(addDays(from,i));head+='<span class="gday'+(d.getDay()===0?" sun":"")+'" style="left:'+(i*W)+'px">'+(d.getDate()===1||i===0?(d.getMonth()+1)+'/':'&nbsp;')+'<br>'+d.getDate()+'</span>'}
  const todayLine='<span class="gtoday" style="left:'+(x(t)*W+W/2)+'px"></span>';
  const rows=list.map(c=>{
    const r=c.receivedAt?ymd(new Date(c.receivedAt)):t;
    let bars=seg(r,c.siteDate||t,"g-new");
    if(c.siteDate)bars+=seg(c.siteDate,c.estSentDate||t,"g-site");
    if(c.estSentDate)bars+=seg(c.estSentDate,c.orderDate||t,c.stage==="hold"?"g-hold":"g-wait");
    if(c.orderDate)bars+=seg(c.orderDate,t,"g-won");
    if(c.planDate&&c.stage==="new"&&diffDays(c.planDate,from)>=0&&diffDays(c.planDate,from)<DAYS)bars+='<span class="gplan" style="left:'+(x(c.planDate)*W+W/2)+'px" title="'+TYPES[c.type].site+'予定 '+md(c.planDate)+'"></span>';
    const td=todos.find(z=>z.caseId===c.id);
    if(td&&td.due){const dd=diffDays(td.due,from);if(dd>=0&&dd<DAYS)bars+='<span class="gmark'+(td.due<t?" over":"")+'" style="left:'+(x(td.due)*W+W/2)+'px" title="'+h(td.title)+' '+md(td.due)+'"></span>'}
    return '<div class="grow"><button type="button" class="glab" data-open="'+h(c.id)+'"><b>'+h(c.property)+' '+h(c.room)+'</b><span class="chip t-'+c.type+'" style="font-size:10px">'+TYPES[c.type].label+'</span>'+(c.ro?'<span class="note" style="font-size:10px">'+h(c.tantou)+'・見るだけ</span>':'')+'</button><div class="gtrack">'+todayLine+bars+'</div></div>';
  }).join("");
  return '<section class="sec"><div class="sec-h"><h2>ガント</h2><span class="note num">動いている案件 '+list.length+'件 ・ 2週間前〜2週間後</span></div>'+
  roNote()+(tans.length>1?'<div class="seg" role="group" aria-label="担当">'+[["all","全員"],...tans.map(n=>[n,n])].map(([k,l])=>'<button type="button" data-gt="'+h(k)+'" aria-pressed="'+((ui.gTantou||"all")===k)+'">'+h(l)+'</button>').join("")+'</div>':'')+
  '<div class="legend"><span><i style="background:var(--accent)"></i>受付〜現地確認</span><span><i style="background:var(--amber)"></i>見積作成</span><span><i style="background:var(--muted);opacity:.45"></i>返事待ち</span><span><i style="background:var(--amber-soft);border:1px dashed var(--amber)"></i>保留</span><span><i style="background:var(--green)"></i>受注・引渡待ち</span><span>◆ 次のToDoの期限（赤は超過）</span><span>｜ 立会・調査の予定日</span></div>'+
  (list.length?'<div class="gwrap" style="--w:'+W+'px;--tw:'+(DAYS*W)+'px"><div class="grow ghead"><div class="glab">案件</div><div class="gtrack">'+head+'</div></div>'+rows+'</div>':'<div class="empty">動いている案件はありません</div>')+
  '<p class="note" style="margin:0">横にスクロールできます。案件名を押すと詳細を開きます。2週間より前に受付した案件は左端から表示します。</p></section>';
}

    reasons.map(([r,n])=>'<div class="brk"><span>'+r+'</span><span class="bar"><i style="width:'+(n/maxR*100)+'%"></i></span><span class="num">'+n+'件</span></div>').join("")+'</div></section>'+

    '<p class="note" style="margin:0">自動で出るToDoの期限日数です。使いながら調整してください。</p>'+

function idb(){return idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open("workhub_receipt_photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>{idbP=null;rej(r.error)}}))}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction("photos",mode),q=fn(tx.objectStore("photos"));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}))}
const photoPut=(k,b)=>idbDo("readwrite",st=>st.put(b,k));
const photoGet=k=>idbDo("readonly",st=>st.get(k));
const photoDel=k=>idbDo("readwrite",st=>st.delete(k));
const photoURL={};
function fillPhotos(){
  main.querySelectorAll("img[data-pkey]").forEach(img=>{const k=img.dataset.pkey;
    if(photoURL[k]){img.src=photoURL[k];return}
    photoGet(k).then(b=>{if(b){photoURL[k]=URL.createObjectURL(b);img.src=photoURL[k]}else img.alt="写真が見つかりません"}).catch(()=>{img.alt="写真を読み込めません"})});
}

/* Minimal .xlsx without a library: one sheet of inline strings, stored (uncompressed) in a ZIP with CRC32 */
const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files,type){
  const enc=new TextEncoder(),parts=[],cd=[],d=new Date();let off=0;
  const dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),name);off+=30+name.length+data.length;
  }
  const cdSize=cd.reduce((s,a)=>s+a.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type});
}
const xe=s=>String(s??"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* sheets: [{name, rows, widths}]; a cell is a string, a number, or {v, s, f} (s: 1 bold, 2 #,##0, 3 bold #,##0; f: formula with cached value v) */
function xlsxBlob(sheets){
  const NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"', X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const sheetXml=sh=>X+'<worksheet '+NS+'><cols>'+sh.widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join("")+'</cols><sheetData>'+
    sh.rows.map((row,ri)=>'<row r="'+(ri+1)+'">'+row.map((cell,ci)=>{
      if(cell==null||cell==="")return "";
      const c=typeof cell==="object"?cell:{v:cell},ref=String.fromCharCode(65+ci)+(ri+1),st=c.s?' s="'+c.s+'"':"";
      if(c.f)return '<c r="'+ref+'"'+st+'><f>'+xe(c.f)+'</f><v>'+(Number(c.v)||0)+'</v></c>';
      if(typeof c.v==="number")return '<c r="'+ref+'"'+st+'><v>'+c.v+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"'+st+'><is><t xml:space="preserve">'+xe(c.v)+'</t></is></c>';
    }).join("")+'</row>').join("")+'</sheetData></worksheet>';
  const nm=x=>String(x).replace(/[\[\]:*?\/\\]/g,"").slice(0,31)||"Sheet";
  return zipStore([
    {name:"[Content_Types].xml",data:X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:"_rels/.rels",data:X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml",data:X+'<workbook '+NS+' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((sh,i)=>'<sheet name="'+xe(nm(sh.name))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+'</sheets></workbook>'},
    {name:"xl/_rels/workbook.xml.rels",data:X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:"xl/styles.xml",data:X+'<styleSheet '+NS+'><fonts count="2"><font><sz val="11"/><name val="Yu Gothic"/></font><font><b/><sz val="11"/><name val="Yu Gothic"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    ...sheets.map((sh,i)=>({name:"xl/worksheets/sheet"+(i+1)+".xml",data:sheetXml(sh)}))
  ],XLSX_MIME);
}
/* Sheet 1 is for people (with blank columns 経理 fills in); sheet "data" is the same rows with English keys for a future accounting screen */
const RCOLS=["No","日付","計上月","支払先","内容","区分","金額","現場（物件・部屋）","仕事番号","受付番号","メモ","写真ファイル名","経理確認（○／差戻し）","確認日","備考"];

const DATA_KEYS=["receiptId","no","date","payee","item","category","amount","company","site","jobNo","caseId","memo","photo","month","settlementNo","submitter","submittedAt"];
const ACCT_STEPS=["経理の方へ：","1. 領収書の写真（原本）と、金額・内容が合っているか確認し、「経理確認」に ○ か 差戻し を記入してください。","2. 差戻しのときは、理由を「備考」に書いて本人に返してください。","3. サーバーの「会社／年月」フォルダに、このファイルと写真を保存してください。"];

const photoNames=(no,n,r)=>r.photos.map((k,i)=>no+"-"+n+(i?"-"+(i+1):"")+"."+((r.pext||{})[k]||"jpg"));
function rBook(title,head,no,list,company,steps){
  const S=RS(), rows=[[{v:title,s:1}],head,[],RCOLS.map(v=>({v,s:1}))];
  list.forEach((r,i)=>rows.push([i+1,slash(r.date),slash(r.date.slice(0,7)),r.payee,r.item,r.cat,{v:Number(r.amount)||0,s:2},r.site,r.jobNo,r.caseId,r.note,photoNames(no,i+1,r).join(" "),"","",""]));
  rows.push([{v:"合計",s:1},"","","","","",{f:"SUM(G5:G"+(4+list.length)+")",v:rSum(list),s:3}]);
  if(steps){rows.push([]);ACCT_STEPS.forEach((x,i)=>rows.push([i?x:{v:x,s:1}]))}
  const data=[DATA_KEYS].concat(list.map((r,i)=>[r.id,i+1,r.date,r.payee,r.item,r.cat,Number(r.amount)||0,r.company,r.site,r.jobNo,r.caseId,r.note,photoNames(no,i+1,r).join(" "),r.date.slice(0,7),no,S.name||"",r.submitDate||todayS()]));
  return [{name:company,rows,widths:RWIDTHS},{name:"data",rows:data,widths:DATA_KEYS.map(()=>14)}];
}
const rClaimSort=list=>list.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
function rClaims(){
  const m=new Map();
  for(const r of DB.receipts)if(r.method==="立替"&&r.claimNo){const g=m.get(r.claimNo)||{no:r.claimNo,company:r.company,date:r.submitDate,list:[]};g.list.push(r);m.set(r.claimNo,g)}
  return [...m.values()].map(g=>Object.assign(g,{list:rClaimSort(g.list),settled:g.list.every(r=>r.status==="精算済")})).sort((a,b)=>b.no.localeCompare(a.no));
}
/* 精算書番号 CP-20261023-01; the counter is kept so a cancelled number is never reused */
function rMakeClaim(co,ids){
  const list=DB.receipts.filter(r=>ids.includes(r.id)&&r.company===co&&r.method==="立替"&&(r.status==="未提出"||r.status==="差戻し"));
  if(!list.length)return "";
  const t=todayS(),pre=co+"-"+t.replace(/-/g,"")+"-",seq=RS().noSeq,n=(seq[pre]||0)+1;seq[pre]=n;
  const no=pre+pad(n);
  list.forEach(r=>{if(r.status==="差戻し")r.edits.push({at:t0(),field:"status",label:"状態",from:"差戻し（"+r.returnedFrom+"）",to:"再提出（"+no+"）"});Object.assign(r,{status:"提出済",claimNo:no,submitDate:t,everSub:true})});
  save();return no;
}
/* Card closing: the closing date on or after a receipt date (締め日 1–31, 0 = 末日), and the period it closes */
const monthClose=(y,m,day)=>{const last=new Date(y,m+1,0).getDate();return new Date(y,m,day?Math.min(day,last):last)};
function closeDateOf(date,day){const d=parseYmd(date),c=monthClose(d.getFullYear(),d.getMonth(),day);return ymd(d>c?monthClose(d.getFullYear(),d.getMonth()+1,day):c)}
function periodFrom(close,day){const c=parseYmd(close),p=monthClose(c.getFullYear(),c.getMonth()-1,day);return addDays(ymd(p),1)}
function cardPeriods(k){
  const m=new Map();
  for(const r of DB.receipts)if(r.method==="法人カード"&&r.cardId===k.id&&r.date){const close=closeDateOf(r.date,k.closeDay);(m.get(close)||m.set(close,[]).get(close)).push(r)}
  return [...m.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([close,list])=>({close,from:periodFrom(close,k.closeDay),list:rClaimSort(list),no:k.company+"-C"+close.replace(/-/g,"")+"-"+k.id,closed:list.every(r=>r.closeNo)}));
}
/* Share the .xlsx with the photos (named <番号>-<No>.jpg); without file sharing, offer downloads instead */
async function rSend(title,text,fileName,no,sheets,list){
  const files=[new File([xlsxBlob(sheets)],fileName,{type:XLSX_MIME})];
  for(let i=0;i<list.length;i++){const names=photoNames(no,i+1,list[i]);
    for(let j=0;j<list[i].photos.length;j++){const b=await photoGet(list[i].photos[j]).catch(()=>null);if(b)files.push(new File([b],names[j],{type:b.type||"image/jpeg"}))}}
  if(navigator.share&&navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({files,title,text});toast("共有しました");return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  rClearDl();
  ui.dl={title,text,items:files.map(f=>({name:f.name,url:URL.createObjectURL(f)}))};
  render();
  const a=main.querySelector("a[data-dlfirst]");if(a)a.click();
  toast("この端末では一緒に送れないため、Excelを保存しました。写真は下から1枚ずつ保存できます",5000);
}
function rClearDl(){if(ui.dl)ui.dl.items.forEach(x=>URL.revokeObjectURL(x.url));ui.dl=null}

/* Reminders for home and ToDo: the day before a company's 精算日, the run-up to the 8月末 決算, and 90+ day old receipts */
function rcptNotices(){
  const t=todayS(),out=[],tom=(parseYmd(t).getDay()+1)%7,all=rPending();
  for(const co of COMPANIES){const pd=Number(RS().payDays[co]),p=rPending(co);if(pd>=0&&pd===tom&&p.length)out.push("明日は"+CO_LABEL[co]+"の精算日です。"+co+" 未提出 "+p.length+"件・"+yen(rSum(p)))}
  const mmdd=t.slice(5);
  if(all.length&&mmdd>="07-15"&&mmdd<="08-31")out.push("決算（8月末）前に立替を出してください。未提出 "+all.length+"件・"+yen(rSum(all)));
  const old=all.filter(r=>r.date&&diffDays(t,r.date)>=90);
  if(old.length)out.push("90日以上前の立替が未提出です（"+old.length+"件・"+yen(rSum(old))+"）");
  return out;
}

/* Google APIs other than Calendar (Sheets / Drive). body: JSON, raw: Blob for uploads */
async function gReq(url,o){
  o=o||{};
  if(!gSignedIn())throw new Error("signin");
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),45000);
  try{
    const r=await fetch(url,{method:o.method||"GET",signal:ctl.signal,cache:"no-store",credentials:"omit",
      headers:Object.assign({Authorization:"Bearer "+G.token},o.body?{"Content-Type":"application/json"}:{},o.headers||{}),body:o.raw||(o.body?JSON.stringify(o.body):undefined)});
    if(r.status===401){G.token="";G.exp=0;throw new Error("signin")}
    if(!r.ok){const e=new Error("http");e.status=r.status;throw e}
    return r.status===204?null:await r.json();
  }finally{clearTimeout(tm)}
}

async function ordersSync(id){
  const rows=(await sheetRead(id,["指示"]))["指示"]||[], seen=new Set();
  let reported=0, removed=0;
  for(let i=1;i<rows.length;i++){
    const [oid,title,due,at,st]=rows[i].map(x=>String(x==null?"":x));
    if(!oid)continue;seen.add(oid);
    const t=DB.todos.find(x=>x.order&&x.id===oid);
    if(st==="取り消し"){if(t){DB.todos.splice(DB.todos.indexOf(t),1);removed++}continue}
    if(st==="完了"){if(t)Object.assign(t,{done:true,synced:true});continue}
    if(!t){DB.todos.push({id:oid,order:true,title,due:cellDate(due),orderedAt:cellDate(at),tantou:RS().name||"自分",done:false});continue}
    Object.assign(t,{title,due:cellDate(due)});
    if(t.done&&!t.synced){
      await gReq(SHEETS+"/"+encodeURIComponent(id)+"/values/"+encodeURIComponent(A1("指示")+"!E"+(i+1)+":G"+(i+1))+"?valueInputOption=RAW",{method:"PUT",body:{values:[["完了",t.doneDate||todayS(),t.doneMemo||""]]}});
      t.synced=true;reported++;save();
    }
  }
  DB.todos=DB.todos.filter(t=>!t.order||seen.has(t.id));save();

/* 会社の動き：社員ごとに「タスクリクエスト」と「社員のToDo」。ToDoは期限切れ→今日→今後7日を一覧、それより先と期限なしは件数だけ */
function corpTodos(x,k){

  const ords=(x.orders||[]), open=ords.filter(o=>o["状態"]==="未完了").sort((a,b)=>(dd(a["期限"])||"9").localeCompare(dd(b["期限"])||"9"));

  const dueTxt=d=>!d?'期限なし':n(d)<0?(-n(d))+'日超過（'+md(d)+'）':n(d)===0?'今日まで':md(d)+'まで';
  const oli=o=>{const d=dd(o["期限"]),red=d&&n(d)<0,key=k+"|"+o["指示ID"];
    return '<li'+(red?' style="color:var(--red)"':'')+'><div class="row"><span class="num"><b>'+dueTxt(d)+'</b></span><span>'+h(o["内容"])+'</span><span class="sp"></span>'+(D().admin?'<button class="btn sm" type="button" data-ocancel="'+h(key)+'">取り消す</button>':'')+'</div>'+
      (ui.oCancel===key?'<div class="ro" role="alert" style="display:flex;flex-direction:column;gap:8px"><span>このリクエストを取り消します。社員の次の同期で、社員のToDoから消えます。</span><div class="row"><button class="btn danger" type="button" data-act="ocanceldo">取り消す</button><button class="btn" type="button" data-act="ocancelno">やめる</button></div></div>':'')+'</li>'};
  const orders='<p class="fk" style="margin:6px 0 0">タスクリクエスト（代表から）</p>'+
    (open.length?'<p class="note" style="margin:2px 0 0">未完了 '+open.length+'件'+(oOver.length?'<b style="color:var(--red)">（期限切れ '+oOver.length+'件）</b>':'')+'</p><ul class="dl">'+open.map(oli).join("")+'</ul>':'<p class="note" style="margin:2px 0 0">未完了のリクエストはありません</p>')+
    (done7.length?'<p class="note" style="margin:6px 0 0">最近7日の完了 '+done7.length+'件</p><ul class="dl">'+done7.map(o=>'<li><span class="num" style="color:var(--green)"><b>✓ '+md(dd(o["完了日"]))+'完了</b></span> '+h(o["内容"])+(o["完了メモ"]?'<div class="note">メモ：'+h(o["完了メモ"])+'</div>':'')+'</li>').join("")+'</ul>':'')+
    (!D().admin?'':'<div class="form" style="margin-top:6px"><label class="f full">リクエストの内容<input type="text" id="oi_t'+k+'" placeholder="例：〇〇の見積を今週中に出す"></label><label class="f">期限<input type="date" id="oi_d'+k+'"></label>'+
      '<div class="full"><button class="btn pri" type="button" data-oadd="'+k+'"'+(ui.oBusy?' disabled':'')+'>リクエストする</button></div></div>')+
    (ui.oMsg&&ui.oMsg.k===k?'<ul class="gres" role="status"><li class="'+(ui.oMsg.ok?'ok':'ng')+'">'+(ui.oMsg.ok?'✓ ':'× ')+h(ui.oMsg.text)+'</li></ul>':'');
  let todos, tOver=[];
  if(!x.todo)todos='<p class="note" style="margin:2px 0 0">ToDoはまだ届いていません（社員のHUBを v1.29 以降にして同期すると届きます）</p>';
  else{
    const rs=x.todo.filter(r=>r["内容"]&&!isReqKind(r["種類"])).map(r=>Object.assign({_d:dd(r["期限"])},r)).sort((a,b)=>(a._d||"9").localeCompare(b._d||"9"));
    tOver=rs.filter(r=>r._d&&n(r._d)<0);const today=rs.filter(r=>r._d&&n(r._d)===0), soon=rs.filter(r=>r._d&&n(r._d)>0&&n(r._d)<=7), later=rs.filter(r=>r._d&&n(r._d)>7), none=rs.filter(r=>!r._d);
    const li=(r,red)=>'<li class="num"'+(red?' style="color:var(--red)"':'')+'><b>'+(red?(-n(r._d))+'日超過（'+md(r._d)+'）':n(r._d)===0?'今日':md(r._d))+'</b> '+h(r["内容"])+(r["物件"]?'<span class="note">・'+h(r["物件"])+' '+h(r["部屋"])+'</span>':'')+'</li>';
    const grp=(label,list,red)=>list.length?'<p class="note" style="margin:6px 0 0'+(red?';color:var(--red);font-weight:700':'')+'">'+label+' '+list.length+'件</p><ul class="dl">'+list.map(r=>li(r,red)).join("")+'</ul>':'';
    const rest=[later.length?'8日以降 '+later.length+'件':'',none.length?'期限なし '+none.length+'件':''].filter(Boolean).join("・");
    todos=rs.length?grp("期限切れ",tOver,true)+grp("今日",today)+grp("今後7日",soon)+(rest?'<p class="note" style="margin:6px 0 0">'+rest+'</p>':''):'<p class="note" style="margin:2px 0 0">ToDoはありません</p>';
    todos='<p class="note num" style="margin:2px 0 0">期限切れ '+tOver.length+'・今日 '+today.length+'・今後7日 '+soon.length+'</p>'+todos;
  }

  return '<details open><summary'+(red?' style="color:var(--red)"':'')+'><b>'+h(x.s.name)+'</b>（リクエスト 未完了 '+open.length+(oOver.length?'・期限切れ '+oOver.length:'')+(x.todo?'／ToDo 期限切れ '+tOver.length:'')+'）</summary>'+

  if(a==="additem"){c.items.push({place:"",state:"",burden:"要確認",amount:""});save();render();
    const f=main.querySelector('[data-item="'+(c.items.length-1)+'"][data-f="place"]');if(f){f.focus();f.scrollIntoView({block:"center"})}return}
  if(a==="greg"&&c){if(ui.gbusy)return;if(!c.planDate){toast("先に日程を決めてください");return}ui.gbusy=true;
    gRegister(c).then(r=>{toast(r==="updated"?"Googleカレンダーの予定を更新しました":"Googleカレンダーに登録しました")},err=>{toast("登録できませんでした："+gMsg(err),5000)}).finally(()=>{ui.gbusy=false;render()});return}
  if(a==="plan"){const d=val("d_plan");if(!d){toast("予定日を入れてください");return}c.planDate=d;save();render();toast(mdh(d)+"に"+TYPES[c.type].site+"の予定を入れました");return}
  if(a==="site"){c.siteDate=val("d_site")||todayS();c.stage="site";save();render();toast(TYPES[c.type].site+"を済みにしました");return}
  if(a==="rushwin"){c.orderDate=todayS();c.stage="won";save();render();toast("受注にしました。Accessへ引き渡してください");return}
  if(a==="quote"){
    if(!(isTaikyo(c)&&c.items.length)){const v=val("d_est");if(v===""){toast("見積額を入力してください");return}c.estAmount=Number(v)}
    if(isTaikyo(c)&&c.items.some(i=>i.burden==="要確認")){toast("負担区分が「要確認」の箇所があります。先に決めてください");return}
    c.estSentDate=val("d_sent")||todayS();c.stage="quoted";save();render();toast("見積を提出済みにしました");return}
  if(a==="win"){c.orderDate=val("d_order")||todayS();c.stage="won";c.holdDate="";save();render();toast("受注にしました。Accessへ引き渡してください");return}
  if(a==="lose"){c.lossReason=val("d_loss");c.lossDate=todayS();c.stage="lost";c.holdDate="";save();render();toast("失注にしました。毎日の一覧から外れます");return}
  if(a==="hold"){const d=val("d_hold");if(!d){toast("次に確認する日を入れてください");return}c.holdDate=d;c.stage="hold";save();render();toast(md(d)+"に再確認のToDoを出します");return}
  if(a==="built"){c.builtDate=val("d_built")||todayS();c.stage="built";save();render();toast("施工完了にしました。次は請求です");return}
  if(a==="bill"){const amt=Number(val("d_bamt")),bd=val("d_bdate"),due=val("d_pdue");
    if(!bd||!due){toast("請求日と入金予定日を入れてください");return}
    if(!(amt>0)){toast("請求額を入れてください");return}
    Object.assign(c,{billDate:bd,billAmount:amt,billTo:val("d_bto").trim()||c.client,payDue:due,stage:"billed"});save();render();toast("請求済みにしました。入金予定は"+mdh(due)+"です");return}
  if(a==="pay"){const amt=Number(val("d_payamt")),pd=val("d_paydate");
    if(!pd){toast("入金日を入れてください");return}
    if(!(amt>0)){toast("入金額を入れてください");return}
    c.payments.push({date:pd,amount:amt,by:val("d_payby")||"担当確認",at:todayS()});
    if(remainOf(c)<=0){c.stage="paid";c.paidDate=pd;save();render();toast("入金済みにしました。この案件は完了です")}
    else{save();render();toast("入金を記録しました。残り "+yen(remainOf(c))+" です")}
    return}
  if(a==="acctnopay"){c.payLog.push({kind:"noPay",at:todayS()});save();render();toast("経理からの返事（まだ入金なし）を記録しました");return}
  if(a==="payundo"){if(!c.payments.length)return;c.payments.pop();if(c.stage==="paid"&&remainOf(c)>0){c.stage="billed";c.paidDate=""}save();render();toast("最後の入金記録を取り消しました");return}
  if(a==="cdel"){Object.assign(ui,{cdel:c.id,cdelMsg:"",cdelBusy:false,cdelCal:true});render();showAlert();return}
  if(a==="cdelno"){ui.cdel=null;render();return}
  if(a==="cdeldo"){if(ui.cdelBusy)return;
    if(DB.receipts.some(r=>r.caseId===c.id))return render();
    const g=c.gcal&&c.gcal.id&&c.gcal.cal?c.gcal:null, withCal=!!g&&ui.cdelCal!==false;
    if(withCal&&!gSignedIn()){ui.cdelMsg="Googleにログインしていないため、カレンダーの予定を消せません。「Googleとまとめて同期」でログインしてからもう一度押すか、チェックを外して案件だけ削除してください";render();return}
    if(!withCal)return caseDelete(c);
    ui.cdelBusy=true;ui.cdelMsg="";render();
    gApi("calendars/"+encodeURIComponent(g.cal)+"/events/"+encodeURIComponent(g.id),{method:"DELETE"})
      .catch(err=>{if(err.status!==404&&err.status!==410)throw err}) /* already gone counts as deleted */
      .then(()=>{caseDelete(c);toast(c.id+"とGoogleカレンダーの予定を削除しました")},
        err=>{ui.cdelBusy=false;ui.cdelMsg="Googleカレンダーの予定を削除できなかったため、案件は削除していません（"+gMsg(err)+"）";render()});
    return}
  if(a==="reopen"){c.stage="quoted";c.lossReason="";c.lossDate="";save();render();return}
  if(a==="hand"){const j=val("d_job").trim();if(!j){toast("Accessで振られた仕事番号を入力してください");return}c.jobNo=j;c.handedDate=todayS();c.stage="handed";save();render();toast("引渡済にしました");return}
  if(a==="csvone"){go("cases",{csv:true});return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.q=t.value;const pos=t.selectionStart;render();const q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(err){}return}
  if(t.id==="d_bdate"){const pd=document.getElementById("d_pdue");if(pd&&t.value){pd.value=payDueOf(t.value,DB.settings.payRule);const dl=main.querySelector('[data-dl="d_pdue"]');if(dl)dl.textContent=mdh(pd.value)+"（"+PAY_RULES[DB.settings.payRule]+"）"}}
  if(t.type==="date"){const dl=main.querySelector('[data-dl="'+t.id+'"]');if(dl)dl.textContent=mdh(t.value)}
  const c=ui.caseId?editCase(ui.caseId):null;
  if(t.dataset.item!=null&&c){const it=c.items[Number(t.dataset.item)];if(it){it[t.dataset.f]=t.dataset.f==="amount"?(t.value===""?"":Number(t.value)):t.value;save();refreshItemTotals(c)}return}
});
document.addEventListener("change",e=>{
  const t=e.target, c=ui.caseId?editCase(ui.caseId):null;
  if(t.id==="showEnded"){ui.showEnded=t.checked;render();return}
  if(t.id==="cdel_gcal"){ui.cdelCal=t.checked;ui.cdelMsg="";render();return}
  if(t.id==="r_photo"){const files=[...t.files];t.value="";files.forEach(f=>(ui.rNew=ui.rNew||[]).push({blob:f,url:URL.createObjectURL(f)}));rPhotoPreview();return}
  if(t.id==="r_case"){const cc=findCase(t.value);if(cc){document.getElementById("r_site").value=(cc.property+" "+cc.room).trim();document.getElementById("r_job").value=cc.jobNo||""}return}
  if(t.id==="r_method"||t.id==="r_co"){const card=val("r_method")==="法人カード",w=document.getElementById("r_cardWrap"),sel=document.getElementById("r_card");if(w)w.hidden=!card;
    if(sel){const ks=RS().cards.filter(k=>k.company===val("r_co"));sel.innerHTML=ks.map(k=>'<option value="'+h(k.id)+'">'+h(k.name)+'</option>').join("")||'<option value="">この会社のカードがありません</option>'}return}
  if(t.id==="payOnly"){ui.payOnly=t.checked;render();return}
  if(t.dataset.item!=null&&c){const it=c.items[Number(t.dataset.item)];if(it){it[t.dataset.f]=t.dataset.f==="amount"?(t.value===""?"":Number(t.value)):t.value;save();refreshItemTotals(c)}return}
  if(t.id==="d_billing"&&c){c.billingTenant=t.value;save();return}
  if(t.id==="d_photo"&&c){
    const files=[...t.files];photos[c.id]=photos[c.id]||[];
    let left=files.length;
    files.forEach(f=>{const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{const s=Math.min(1,480/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=img.width*s;cv.height=img.height*s;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);photos[c.id].push(cv.toDataURL("image/jpeg",.7));URL.revokeObjectURL(url);if(--left===0)render()};img.onerror=()=>{if(--left===0)render()};img.src=url});
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="newForm"){
    DB.seq=(DB.seq||0)+1;const id="U-"+String(DB.seq).padStart(4,"0");
    const type=val("n_type"),at=val("n_at");
    DB.cases.unshift({id,type,stage:"new",clientKind:val("n_kind"),client:val("n_client").trim(),property:val("n_prop").trim(),room:val("n_room").trim(),addr:val("n_addr").trim(),tantou:val("n_tantou"),
      receivedAt:at?new Date(at).toISOString():new Date().toISOString(),symptom:type==="kinkyu"?val("n_sym"):"",note:val("n_note").trim(),
      items:[],estAmount:null,estSentDate:"",siteDate:"",lossReason:"",lossDate:"",holdDate:"",orderDate:"",jobNo:"",billingTenant:"入居者に直接",handedDate:""});
    save();go("detail",{caseId:id});toast(id+"で受付しました");return}
  if(f.id==="rForm"){rSaveForm();return}
  if(f.id==="rsetForm"){const S=RS();S.name=val("rs_name").trim();COMPANIES.forEach(co=>{S.payDays[co]=Number(val("rs_pd_"+co));S.to[co]=val("rs_to_"+co).trim()});S.useCard=document.getElementById("rs_card").checked;save();render();toast("領収書の設定を保存しました");return}
  if(f.id==="todoForm"){DB.todos.push({id:"T"+Date.now(),title:val("td_title").trim(),due:val("td_due"),tantou:val("td_tantou"),done:false});save();render();toast("ToDoを追加しました");return}
  if(f.id==="gsetForm"){const picked=[...f.querySelectorAll('input[name="gshow"]:checked')].map(x=>G.cals[Number(x.value)]).filter(Boolean).map(c=>c.id);
    DB.settings.gShow=picked;DB.settings.gWrite=val("g_write");for(const x in gcalCache)delete gcalCache[x];save();render();toast("Googleカレンダーの設定を保存しました");return}
  if(f.id==="setForm"){for(const k of ["schedule","quote","reply","jobno","billAfter","acctWait"]){const v=Number(val("s_"+k));if(!isNaN(v)&&v>=0)DB.settings[k]=v}if(PAY_RULES[val("s_payRule")])DB.settings.payRule=val("s_payRule");save();render();toast("期限の日数を保存しました");return}
});
/* 予定画面：横にスワイプして前後へ（日表示は1日、週表示は1週、月表示は1か月） */
let swX=null,swY=null;
main.addEventListener("touchstart",e=>{if(ui.view!=="cal"||e.touches.length!==1){swX=null;return}swX=e.touches[0].clientX;swY=e.touches[0].clientY},{passive:true});
main.addEventListener("touchend",e=>{
  if(swX==null||ui.view!=="cal")return;
  const t=e.changedTouches[0],dx=t.clientX-swX,dy=t.clientY-swY;swX=null;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const dir=dx<0?1:-1;
  if(ui.calView==="month"){const [y,m]=ui.calMonth.split("-").map(Number);const d=new Date(y,m-1+dir,1);ui.calMonth=d.getFullYear()+"-"+pad(d.getMonth()+1);ui.calDay=ymd(d)}
  else{ui.calDay=addDays(ui.calDay,dir*(ui.calView==="week"?7:1));ui.calMonth=ui.calDay.slice(0,7)}
  render();
},{passive:true});
setInterval(()=>{document.querySelectorAll("[data-since]").forEach(el=>el.textContent=since(el.dataset.since))},30000);
render();
})();
</script>
