<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3a40">
<meta name="referrer" content="no-referrer">
<title>CPG HUB</title>
<meta name="application-name" content="CPG HUB">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./work-hub-icon-192.png?v=9f230a65fac4">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=179722669fe6">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
</head>
<body>
<style>
/* Layout: one mobile column (max 720px), sticky header, fixed bottom nav like PAPA HUB; cards only for cases and ToDo rows */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --sunk:#e8eeee; --line:#d3dcdc;
  --fg:#15232b; --muted:#5a6a71; --accent:#0b6b72; --accent-fg:#ffffff; --accent-soft:#dcefef;
  --red:#b93a26; --red-soft:#fbe6e1; --amber:#9a6412; --amber-soft:#f8ecd6; --green:#2d7449; --green-soft:#e0f0e5; --blue:#1d5fb8; --blue-soft:#e3edfb; --gc0:#6a3fa0; --gc0-soft:#efe6f8; --gc1:#a3336b; --gc1-soft:#f9e3ee; --gc2:#3d5a80; --gc2-soft:#e2e9f2; --gc3:#6b6b1f; --gc3-soft:#eeeed8;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172225; --sunk:#1e2c30; --line:#2c3d42;
  --fg:#e3ecee; --muted:#93a6ac; --accent:#4fb8bf; --accent-fg:#06272a; --accent-soft:#163a3d;
  --red:#ef8a76; --red-soft:#3a1d18; --amber:#e3b45f; --amber-soft:#35290f; --green:#7cc896; --green-soft:#16301f; --blue:#86b4f5; --blue-soft:#172a44; --gc0:#c4a3ee; --gc0-soft:#2b2040; --gc1:#f09cc4; --gc1-soft:#3a1a2a; --gc2:#a9c1e0; --gc2-soft:#1d2836; --gc3:#d4d48a; --gc3-soft:#2c2c14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172225; --sunk:#1e2c30; --line:#2c3d42;
  --fg:#e3ecee; --muted:#93a6ac; --accent:#4fb8bf; --accent-fg:#06272a; --accent-soft:#163a3d;
  --red:#ef8a76; --red-soft:#3a1d18; --amber:#e3b45f; --amber-soft:#35290f; --green:#7cc896; --green-soft:#16301f; --blue:#86b4f5; --blue-soft:#172a44; --gc0:#c4a3ee; --gc0-soft:#2b2040; --gc1:#f09cc4; --gc1-soft:#3a1a2a; --gc2:#a9c1e0; --gc2-soft:#1d2836; --gc3:#d4d48a; --gc3-soft:#2c2c14;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.02em}
.brandbox{display:flex;flex-direction:column;line-height:1.1}
.ver{font-size:10px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.proto{font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--amber-soft);color:var(--amber);padding:2px 8px;border-radius:99px}
.top-in .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:720px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
.nav-in button{border:0;background:none;cursor:pointer;font-weight:700;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.nav-in button[aria-current="page"]{color:var(--accent)}
.nav-in button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav-in .ic{font-size:18px;line-height:1}
.badge{position:absolute;top:6px;right:calc(50% - 26px);background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
.note{font-size:12.5px;color:var(--muted)}
.banner{background:var(--amber-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:13px}
.banner b{color:var(--amber)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-h h2{font-size:17px}
.sec-h .sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile .k{font-size:12px;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--f-display);font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.tile.alert .v{color:var(--red)}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.urgent{border-left:5px solid var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.row .sp{flex:1}
.ttl{font-weight:700;min-width:0;overflow-wrap:anywhere}
.chip{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.t-kinkyu{background:var(--red-soft);color:var(--red)}
.chip.t-taikyo{background:var(--accent-soft);color:var(--accent)}
.chip.t-reno{background:var(--amber-soft);color:var(--amber)}
.chip.t-teiki{background:var(--green-soft);color:var(--green)}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.pill.s-won{border-color:var(--green);color:var(--green)}
.pill.s-handed{background:var(--sunk);color:var(--muted)}
.pill.s-lost{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.pill.s-hold{border-color:var(--amber);color:var(--amber)}
.pill.s-new{border-color:var(--accent);color:var(--accent)}
.due{font-size:12.5px;color:var(--muted)}
.due.over{color:var(--red);font-weight:700}
.due.today{color:var(--amber);font-weight:700}
.since{color:var(--red);font-weight:700;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:42px}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:15px}
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.steps span{flex:1;min-width:64px;text-align:center;font-size:11.5px;font-weight:700;padding:6px 4px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.steps span.cur{background:var(--accent);color:var(--accent-fg)}
.steps span.end{background:var(--sunk);color:var(--muted);text-decoration:line-through}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto}
table.items{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.items th{text-align:left;font-size:12px;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
table.items td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.items input,table.items select{min-height:36px;padding:5px 8px}
.items-list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-width:0}
.item-h{display:flex;align-items:center;gap:8px}
.item-h h4{margin:0;font-size:14px;font-family:var(--f-display)}
.item-h .sp{flex:1}
.fk{font-size:13px;font-weight:700;color:var(--muted)}
.item.example{background:transparent;border-style:dashed;color:var(--muted)}
.item.example dl.kv+dl.kv{border-top:1px dashed var(--line);padding-top:8px}
.seg.burden button{flex:1;min-height:42px;font-size:14px;border-radius:10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.sum .k{font-size:11.5px;color:var(--muted);font-weight:700}
.sum .v{font-weight:700;font-variant-numeric:tabular-nums}
.ro{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.brk{display:grid;grid-template-columns:7.5em 1fr 3em;gap:8px;align-items:center;font-size:13.5px}
.big{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.calnav{display:flex;align-items:center;gap:8px}
.calnav h2{font-size:17px;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.cal .wd.sun,.cal .d.sun .n,.cal .d.hol .n{color:var(--red)}
.cal .hn{font-size:9.5px;line-height:1.2;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .wd.sat,.cal .d.sat .n{color:var(--blue)}
.cal .d{min-height:70px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px;font-size:11px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.cal .d.sat{background:var(--blue-soft)}
.cal .d.sun,.cal .d.hol{background:var(--red-soft)}
.cal .d.out{opacity:.45}
.cal .d.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .n{font-weight:700;font-variant-numeric:tabular-nums}
.cal .d.today .n{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 6px;align-self:flex-start}
.ev{font-size:10px;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ev.plan{background:var(--accent-soft);color:var(--accent)}
.ev.site{background:var(--green-soft);color:var(--green)}
.ev.quote{background:var(--amber-soft);color:var(--amber)}
.ev.won{background:var(--sunk);color:var(--fg)}
.ev.off{background:var(--red);color:var(--surface);font-weight:900}
.ev.td{color:var(--muted);font-weight:400}
.ev.td.over{color:var(--red);font-weight:700}
.wk{display:flex;flex-direction:column;gap:6px}
.wkrow{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0}
.wkrow.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wkd{border:0;background:var(--sunk);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;line-height:1.2;color:var(--fg);min-height:52px}
.wkd .dn{font-family:var(--f-display);font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.wkd .dw{font-size:11.5px;font-weight:700}
.wkd.sun,.wkd.hol{color:var(--red)}
.hol-name{font-size:12px;font-weight:700;color:var(--red)}
.wkd.sat{color:var(--blue)}
.wkrow.sat{background:var(--blue-soft)}
.wkrow.sun,.wkrow.hol{background:var(--red-soft)}
.wkd.sat,.wkd.sun,.wkd.hol{background:var(--surface)}
.dtitle{border-radius:8px;padding:2px 8px}
.dtitle.sat{background:var(--blue-soft);color:var(--blue)}
.dtitle.sun,.dtitle.hol{background:var(--red-soft);color:var(--red)}
.wkd.today{background:var(--accent);color:var(--accent-fg)}
.wki{display:flex;flex-direction:column;gap:3px;min-width:0;justify-content:center}
.wkev{border:0;background:none;padding:2px 0;text-align:left;cursor:pointer;display:flex;gap:6px;align-items:center;min-width:0;font-size:13px;color:var(--fg)}
.wkev .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkev .ev{font-size:11px;flex:none}
.wkev.td{cursor:default;color:var(--muted)}
.wkev.td.over{color:var(--red);font-weight:700}
.wknone{font-size:12.5px;color:var(--muted)}
.ev.gc0{background:var(--gc0-soft);color:var(--gc0)} .ev.gc1{background:var(--gc1-soft);color:var(--gc1)} .ev.gc2{background:var(--gc2-soft);color:var(--gc2)} .ev.gc3{background:var(--gc3-soft);color:var(--gc3)}
.wkev.gcev{cursor:default}
.card.gccard{cursor:default}
.card.gccard:hover{border-color:var(--line)}
.gcst{margin:0;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gcst .ev{font-size:11px}
.gsync{display:flex;flex-direction:column;gap:6px}
.gsyncbtn{width:100%;min-height:56px;font-size:16px;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:12px}
.gsyncbtn:hover{filter:brightness(1.08)}
.gsyncbtn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.gsyncbtn[disabled]{opacity:.6}
.gres{margin:0;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.gres .ng{color:var(--red)}
.gres .ok{color:var(--green)}
.gcals{display:flex;flex-direction:column;gap:6px}
.gcals label{display:flex;gap:8px;align-items:center;font-size:14px}
.gcals input{width:20px;height:20px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.grow{display:grid;grid-template-columns:9em var(--tw);border-bottom:1px solid var(--line);width:max-content}
.grow:last-child{border-bottom:0}
.glab{position:sticky;left:0;z-index:2;background:var(--surface);border:0;border-right:1px solid var(--line);text-align:left;padding:4px 8px;font-size:12px;cursor:pointer;min-width:0;overflow:hidden;line-height:1.35}
.glab b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtrack{position:relative;height:44px;background-image:repeating-linear-gradient(to right,transparent 0 calc(var(--w) - 1px),var(--sunk) calc(var(--w) - 1px) var(--w))}
.ghead .gtrack{height:30px}
.ghead .glab{cursor:default;color:var(--muted);font-weight:700}
.gday{position:absolute;top:0;width:var(--w);text-align:center;font-size:10.5px;color:var(--muted);line-height:1.25;font-variant-numeric:tabular-nums}
.gday.sun{color:var(--red)}
.gseg{position:absolute;top:16px;height:13px;border-radius:3px}
.g-new{background:var(--accent)}
.g-site{background:var(--amber)}
.g-wait{background:var(--muted);opacity:.45}
.g-hold{background:var(--amber-soft);border:1px dashed var(--amber)}
.g-won{background:var(--green)}
.gmark{position:absolute;top:16px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--fg);border:2px solid var(--surface)}
.gmark.over{background:var(--red)}
.gplan{position:absolute;top:10px;height:24px;width:4px;margin-left:-2px;border-radius:2px;background:var(--accent)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.55;z-index:1}
.back{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;align-self:flex-start}
@media (prefers-reduced-motion:no-preference){.card,.tile,.btn{transition:border-color .15s}}
</style>

<header class="top"><div class="top-in">
  <span class="brandbox"><span class="brand">CPG HUB</span><span class="ver">v1.10・10/23更新</span></span><span class="proto">試作・架空データ</span>
  <span class="sp"></span>
  <button class="btn pri sm" type="button" data-act="new">＋ 受付</button>
</div></header>

<main id="main"></main>

<nav class="bottom" aria-label="メニュー"><div class="nav-in">
  <button type="button" data-nav="home"><span class="ic">⌂</span>ホーム</button>
  <button type="button" data-nav="cases"><span class="ic">☰</span>案件</button>
  <button type="button" data-nav="todo"><span class="ic">✓</span>ToDo<span class="badge" id="todoBadge" hidden></span></button>
  <button type="button" data-nav="cal"><span class="ic">▦</span>予定</button>
  <button type="button" data-nav="gantt"><span class="ic">≡</span>ガント</button>
  <button type="button" data-nav="stats"><span class="ic">▤</span>数字</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
"use strict";
const KEY="workhub_proto_v1";
const TYPES={
  kinkyu:{label:"緊急対応",site:"現地対応"},
  taikyo:{label:"退去立会",site:"立会"},
  reno:{label:"リノベーション",site:"現地調査"},
  teiki:{label:"定期清掃",site:"現地確認"}
};
const STAGES={new:"受付",site:"現地確認済",quoted:"見積提出済",hold:"保留",won:"受注・引渡待ち",handed:"Access引渡済",lost:"失注"};
const SYMPTOMS=["水漏れ","給湯器凍結","その他"];
const LOSS=["価格","他社に決定","時期が合わない","連絡なし","その他"];
const CLIENT_KINDS=["管理会社","大家さん","その他"];
const STAFF=["黒木","トシ"];
const BURDEN=["家主","入居者","要確認"];

const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);if(!d)return "";d.setDate(d.getDate()+Number(n||0));return ymd(d)};
const todayS=()=>ymd(new Date());
const md=s=>{const d=parseYmd(s);return d?(d.getMonth()+1)+"/"+d.getDate():"—"};
const yen=n=>(n==null||n===""||isNaN(n))?"—":Number(n).toLocaleString("ja-JP")+"円";
const diffDays=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);

/* Stored-data defaults: when a field is added, give it a default here. withDefaults only fills keys that are missing */
const SCHEMA_VERSION=2;
const CASE_DEFAULTS=()=>({addr:"",items:[],note:"",symptom:"",planDate:"",estAmount:null,estSentDate:"",siteDate:"",lossReason:"",lossDate:"",holdDate:"",orderDate:"",jobNo:"",billingTenant:"入居者に直接",handedDate:"",gcal:null});
const TODO_DEFAULTS=()=>({title:"",due:"",tantou:"",done:false});
const SETTINGS_DEFAULTS=()=>({schedule:2,quote:3,reply:14,jobno:1,gShow:null,gWrite:""});
const withDefaults=(o,defs)=>{for(const k in defs)if(o[k]===undefined)o[k]=defs[k];return o};
function upgrade(db){
  const obj=x=>x&&typeof x==="object"&&!Array.isArray(x);
  db.cases=db.cases.filter(obj);
  db.cases.forEach(c=>{withDefaults(c,CASE_DEFAULTS());if(!Array.isArray(c.items))c.items=[]});
  db.todos=(Array.isArray(db.todos)?db.todos:[]).filter(obj);
  db.todos.forEach((t,i)=>{withDefaults(t,TODO_DEFAULTS());if(t.id==null)t.id="T-old"+(i+1)});
  if(!obj(db.settings))db.settings={};
  withDefaults(db.settings,SETTINGS_DEFAULTS());
  if(typeof db.seq!=="number")db.seq=db.cases.reduce((m,c)=>Math.max(m,Number(String(c.id).replace(/\D/g,""))||0),0);
  /* v2: the sample set was cut to 6 cases; drop the removed samples, but only ones still marked （架空） / （例） so entered data is never touched */
  if(!(db.schemaVersion>=2)){
    const gone=["U-0015","U-0014","U-0013","U-0011","U-0009","U-0006","U-0005","U-0003","U-0002","U-0001"];
    db.cases=db.cases.filter(c=>!(gone.includes(c.id)&&String(c.client).includes("（架空）")));
    db.todos=db.todos.filter(t=>!(t.id==="T2"&&String(t.title).includes("（例）")));
  }
  db.schemaVersion=SCHEMA_VERSION;
  return db;
}

function sample(){
  const t=todayS(), now=new Date();
  const ago=(mins)=>new Date(now.getTime()-mins*60000).toISOString();
  const d=n=>addDays(t,n);
  const A={"グリーンコート相模台（架空）":"神奈川県相模原市南区（例）","サンプルハイツ（架空）":"神奈川県相模原市中央区（例）","テストマンション（架空）":"神奈川県相模原市緑区（例）","サンプルコーポ（架空）":"神奈川県座間市（例）","テストハイム（架空）":"神奈川県大和市（例）"};
  const C=(o)=>Object.assign(CASE_DEFAULTS(),{addr:A[o.property]||""},o);
  const nextSat=(6-now.getDay()+7)%7||7;
  return {schemaVersion:SCHEMA_VERSION,seq:16,settings:SETTINGS_DEFAULTS(),todos:[
    {id:"T1",title:"管理会社への定期訪問（例）",due:d(1),tantou:"黒木",done:false}
  ],cases:[
    C({id:"U-0016",type:"kinkyu",stage:"new",clientKind:"管理会社",client:"みどり台ハウジング（架空）",property:"グリーンコート相模台（架空）",room:"203",tantou:"黒木",receivedAt:ago(95),symptom:"水漏れ",note:"天井から水滴。下階の入居者から連絡あり（例）"}),
    C({id:"U-0015",type:"taikyo",stage:"new",clientKind:"大家さん",client:"大家 佐藤様（架空）",property:"サンプルハイツ（架空）",room:"102",tantou:"黒木",receivedAt:ago(60*26),planDate:d(nextSat),note:"土曜の立会の例（例）"}),
    C({id:"U-0012",type:"taikyo",stage:"site",clientKind:"管理会社",client:"みどり台ハウジング（架空）",property:"グリーンコート相模台（架空）",room:"105",tantou:"黒木",receivedAt:ago(60*24*5),siteDate:d(-1),items:[
      {place:"洋室 壁クロス",state:"タバコのヤニ汚れ",burden:"入居者",amount:38000},
      {place:"洋室 壁クロス",state:"日焼け（経年）",burden:"家主",amount:22000},
      {place:"フローリング",state:"引きずり傷 30cm",burden:"要確認",amount:15000},
      {place:"室内全体",state:"退去クリーニング",burden:"入居者",amount:35000}]}),
    C({id:"U-0010",type:"reno",stage:"quoted",clientKind:"大家さん",client:"大家 中村様（架空）",property:"サンプルコーポ（架空）",room:"201",tantou:"トシ",receivedAt:ago(60*24*12),siteDate:d(-9),estSentDate:d(-5),estAmount:1280000,note:"水回り一式の改修（例）"}),
    C({id:"U-0008",type:"reno",stage:"hold",clientKind:"大家さん",client:"大家 田中様（架空）",property:"テストハイム（架空）",room:"102",tantou:"トシ",receivedAt:ago(60*24*30),siteDate:d(-27),estSentDate:d(-24),estAmount:860000,holdDate:d(-1),note:"来期の予算で検討とのこと（例）"}),
    C({id:"U-0007",type:"teiki",stage:"won",clientKind:"管理会社",client:"みどり台ハウジング（架空）",property:"グリーンコート相模台（架空）",room:"共用部",tantou:"黒木",receivedAt:ago(60*24*14),siteDate:d(-12),estSentDate:d(-10),estAmount:18000,orderDate:d(-1)}),
    C({id:"U-0004",type:"reno",stage:"lost",clientKind:"大家さん",client:"大家 高橋様（架空）",property:"テストマンション（架空）",room:"105",tantou:"トシ",receivedAt:ago(60*24*25),siteDate:d(-22),estSentDate:d(-20),estAmount:640000,lossReason:"価格",lossDate:d(-6)})
  ]};
}

let DB;
try{const raw=localStorage.getItem(KEY);DB=raw?JSON.parse(raw):null}catch(e){DB=null}
let upgraded=false;
if(!DB||!Array.isArray(DB.cases))DB=sample();
else{upgraded=DB.schemaVersion!==SCHEMA_VERSION;upgrade(DB)}
/* The failure toast is deferred so it replaces the success toast the same handler shows after save() */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));return true}catch(e){setTimeout(()=>toast("保存できませんでした。端末の空き容量やブラウザの設定を確認してください",6000),0);return false}};
if(upgraded)save();
const photos={};
const ui={view:"home",caseId:null,q:"",type:"all",showEnded:false,tTantou:"all",tPeriod:"week",csv:false,calMonth:todayS().slice(0,7),calDay:todayS(),calView:"month"};

const findCase=id=>DB.cases.find(c=>c.id===id);
const isTaikyo=c=>c.type==="taikyo";
const itemsSum=(c,b)=>c.items.filter(i=>!b||i.burden===b).reduce((s,i)=>s+(Number(i.amount)||0),0);
const estOf=c=>isTaikyo(c)&&c.items.length?itemsSum(c):c.estAmount;
const ended=c=>c.stage==="lost"||c.stage==="handed";

function genTodos(){
  const S=DB.settings, out=[];
  for(const c of DB.cases){
    const base={caseId:c.id,tantou:c.tantou,auto:true};
    const rd=c.receivedAt?ymd(new Date(c.receivedAt)):todayS();
    if(c.stage==="new")out.push(Object.assign({},base,c.type==="kinkyu"?{title:"緊急：担当を手配して現地へ向かう",due:rd}:c.planDate?{title:TYPES[c.type].site+"を実施",due:c.planDate}:{title:TYPES[c.type].site+"の日程を調整",due:addDays(rd,S.schedule)}));
    if(c.stage==="site")out.push(Object.assign({},base,{title:"見積書をExcelで作成して提出",due:addDays(c.siteDate||rd,S.quote)}));
    if(c.stage==="quoted")out.push(Object.assign({},base,{title:"受注か失注かを依頼元に確認",due:addDays(c.estSentDate,S.reply)}));
    if(c.stage==="hold")out.push(Object.assign({},base,{title:"保留中の案件を再確認",due:c.holdDate}));
    if(c.stage==="won")out.push(Object.assign({},base,{title:"Accessで現場管理表を作成し、仕事番号を記録",due:addDays(c.orderDate,S.jobno)}));
  }
  for(const t of DB.todos)if(!t.done)out.push(Object.assign({manual:true},t));
  return out.sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
}
function dueLabel(due){
  if(!due)return '<span class="due">期限なし</span>';
  const n=diffDays(due,todayS());
  if(n<0)return '<span class="due over">'+(-n)+'日超過（'+md(due)+'）</span>';
  if(n===0)return '<span class="due today">今日まで</span>';
  return '<span class="due">'+md(due)+'まで（あと'+n+'日）</span>';
}
function since(iso){
  const m=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000));
  const d=Math.floor(m/1440),hh=Math.floor(m%1440/60),mm=m%60;
  return "受付から"+(d?d+"日":"")+(d||hh?hh+"時間":"")+mm+"分";
}
const typeChip=c=>'<span class="chip t-'+c.type+'">'+TYPES[c.type].label+'</span>';
const stagePill=c=>'<span class="pill s-'+c.stage+'">'+STAGES[c.stage]+'</span>';

function caseCard(c){
  const urgent=c.type==="kinkyu"&&!ended(c)&&c.stage!=="won";
  return '<button type="button" class="card'+(urgent?" urgent":"")+'" data-open="'+c.id+'">'+
    '<div class="row">'+typeChip(c)+'<span class="note num">'+h(c.id)+'</span><span class="sp"></span>'+stagePill(c)+'</div>'+
    '<div class="ttl">'+h(c.property)+' '+h(c.room)+(c.symptom?' ・ '+h(c.symptom):'')+'</div>'+
    '<div class="row note"><span>'+h(c.client)+'</span><span>担当 '+h(c.tantou)+'</span>'+(estOf(c)!=null?'<span class="num">見積 '+yen(estOf(c))+'</span>':'')+'</div>'+
    (urgent?'<div class="since" data-since="'+h(c.receivedAt)+'">'+since(c.receivedAt)+'</div>':'')+
  '</button>';
}
function todoRow(t){
  const c=t.caseId?findCase(t.caseId):null;
  return '<div class="card" style="cursor:default">'+
    '<div class="row"><span class="ttl">'+h(t.title)+'</span><span class="sp"></span>'+dueLabel(t.due)+'</div>'+
    '<div class="row note">'+(c?typeChip(c)+'<span>'+h(c.property)+' '+h(c.room)+'</span>':'<span class="chip">手入力</span>')+'<span>担当 '+h(t.tantou)+'</span><span class="sp"></span>'+
    (c?'<button class="btn sm" type="button" data-open="'+c.id+'">案件を開く</button>':'<button class="btn sm" type="button" data-done="'+h(t.id)+'">完了</button>')+'</div></div>';
}

function vHome(){
  const todos=genTodos(), t=todayS();
  const over=todos.filter(x=>x.due&&x.due<t), todayT=todos.filter(x=>x.due===t);
  const urgent=DB.cases.filter(c=>c.type==="kinkyu"&&(c.stage==="new"||c.stage==="site"));
  const waiting=DB.cases.filter(c=>c.stage==="won");
  const active=DB.cases.filter(c=>!ended(c));
  return '<div class="banner"><b>試作です。</b>（架空）と付いた案件は練習用の例です。入力した内容はこの端末のブラウザにだけ残ります。</div>'+
  '<section class="sec">'+gSyncPanel()+'</section>'+
  '<section class="sec"><div class="tiles">'+
    '<button type="button" class="tile'+(over.length?" alert":"")+'" data-nav="todo"><span class="k">期限切れのToDo</span><span class="v">'+over.length+'</span></button>'+
    '<button type="button" class="tile" data-nav="todo"><span class="k">今日までのToDo</span><span class="v">'+todayT.length+'</span></button>'+
    '<button type="button" class="tile'+(urgent.length?" alert":"")+'" data-nav="cases" data-type="kinkyu"><span class="k">対応中の緊急</span><span class="v">'+urgent.length+'</span></button>'+
    '<button type="button" class="tile" data-nav="cases"><span class="k">動いている案件</span><span class="v">'+active.length+'</span></button>'+
  '</div></section>'+
  (urgent.length?'<section class="sec"><div class="sec-h"><h2>緊急対応</h2><span class="note">受付からの経過時間</span></div><div class="list">'+urgent.map(caseCard).join("")+'</div></section>':'')+
  '<section class="sec"><div class="sec-h"><h2>期限切れ・今日のToDo</h2><span class="sp"></span><button class="btn sm" type="button" data-nav="todo">すべて見る</button></div><div class="list">'+
    ([...over,...todayT].slice(0,6).map(todoRow).join("")||'<div class="empty">期限切れと今日までのToDoはありません</div>')+'</div></section>'+
  '<section class="sec"><div class="sec-h"><h2>Accessへの引渡待ち</h2><span class="note">受注済み・仕事番号の記録待ち</span></div><div class="list">'+
    (waiting.map(caseCard).join("")||'<div class="empty">引渡待ちの案件はありません</div>')+'</div></section>';
}

function vCases(){
  const q=ui.q.trim();
  let list=DB.cases.filter(c=>(ui.showEnded||!ended(c))&&(ui.type==="all"||c.type===ui.type));
  if(q)list=list.filter(c=>[c.id,c.client,c.property,c.room,c.addr,c.note,c.jobNo,c.symptom].join(" ").includes(q));
  const order={new:0,site:1,quoted:2,hold:3,won:4,handed:5,lost:6};
  list.sort((a,b)=>(b.type==="kinkyu")-(a.type==="kinkyu")||order[a.stage]-order[b.stage]||b.id.localeCompare(a.id));
  const won=DB.cases.filter(c=>c.stage==="won");
  return '<section class="sec"><div class="sec-h"><h2>案件</h2><span class="note num">'+list.length+'件</span><span class="sp"></span>'+
    '<button class="btn sm" type="button" data-act="csv"'+(won.length?'':' disabled')+'>引渡待ちをAccess用に書き出す（'+won.length+'）</button></div>'+
    (ui.csv?csvPanel(won):'')+
    '<input type="search" id="q" placeholder="物件・依頼元・番号で探す" value="'+h(ui.q)+'">'+
    '<div class="seg" role="group" aria-label="依頼の種類">'+[["all","すべて"],...Object.entries(TYPES).map(([k,v])=>[k,v.label])].map(([k,l])=>'<button type="button" data-type="'+k+'" aria-pressed="'+(ui.type===k)+'">'+l+'</button>').join("")+'</div>'+
    '<label class="row note"><input type="checkbox" id="showEnded"'+(ui.showEnded?" checked":"")+'> 失注・引渡済の案件も表示する</label>'+
    '<div class="list">'+(list.map(caseCard).join("")||'<div class="empty">該当する案件はありません</div>')+'</div></section>';
}
const CSV_COLS=["受付番号","依頼種類","依頼元区分","依頼元","物件","部屋","住所","担当","受付日","症状","見積金額","家主負担","入居者負担","入居者負担の請求先","受注日","メモ"];
function csvText(list){
  const q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [CSV_COLS.join(","),...list.map(c=>[c.id,TYPES[c.type].label,c.clientKind,c.client,c.property,c.room,c.addr,c.tantou,c.receivedAt?ymd(new Date(c.receivedAt)):"",c.symptom,estOf(c)??"",isTaikyo(c)?itemsSum(c,"家主"):"",isTaikyo(c)?itemsSum(c,"入居者"):"",isTaikyo(c)?c.billingTenant:"",c.orderDate,c.note].map(q).join(","))].join("\n");
}
function csvPanel(list){
  return '<div class="panel"><h3>Access取込用データ（受注・引渡待ち '+list.length+'件）</h3>'+
  '<p class="note" style="margin:0">列の並びは仮です。Accessの現場管理表の項目がわかり次第、そのとおりに合わせます。</p>'+
  '<textarea id="csvOut" readonly rows="6" style="font-size:12px">'+h(csvText(list))+'</textarea>'+
  '<div class="row"><button class="btn pri sm" type="button" data-act="copycsv">コピー</button><button class="btn sm" type="button" data-act="csvclose">閉じる</button></div></div>';
}

  return '<button class="back" type="button" data-nav="cases">‹ 案件へ戻る</button>'+

function stepBar(c){
  const keys=["new","site","quoted","decide","handed"], labels=["受付",TYPES[c.type].site,"見積","受注","引渡"];
  const pos={new:0,site:1,quoted:2,hold:2,won:3,lost:3,handed:4}[c.stage];
  return '<div class="steps" aria-label="進み具合">'+keys.map((k,i)=>{
    let cls=i<pos?"done":i===pos?"cur":"";
    if(c.stage==="lost"&&i===3)cls="end";
    const lab=i===3&&c.stage==="lost"?"失注":i===2&&c.stage==="hold"?"保留":labels[i];
    return '<span class="'+cls+'">'+lab+'</span>';
  }).join("")+'</div>';
}
function itemsPanel(c,ro){
  const cards=c.items.map((it,i)=>{
    const n=i+1, id=f=>'it'+i+'_'+f;
    if(ro)return '<div class="item"><div class="item-h"><h4>箇所 '+n+'</h4></div><dl class="kv">'+
      '<dt>箇所</dt><dd>'+(h(it.place)||'—')+'</dd><dt>状態</dt><dd>'+(h(it.state)||'—')+'</dd>'+
      '<dt>負担</dt><dd>'+h(it.burden)+'</dd><dt>金額</dt><dd class="num">'+yen(it.amount)+'</dd></dl></div>';
    return '<div class="item"><div class="item-h"><h4 id="'+id("h")+'">箇所 '+n+'</h4><span class="sp"></span><button class="btn sm danger" type="button" data-delitem="'+i+'" aria-label="箇所 '+n+'を削除">削除</button></div>'+
      '<label class="f">箇所<input type="text" data-item="'+i+'" data-f="place" value="'+h(it.place)+'" placeholder="例：洋室 壁クロス"></label>'+
      '<label class="f">状態<input type="text" data-item="'+i+'" data-f="state" value="'+h(it.state)+'" placeholder="例：タバコのヤニ汚れ／日焼け（経年）"></label>'+
      '<div class="f" style="display:flex;flex-direction:column;gap:4px"><span class="fk" id="'+id("b")+'">負担</span><div class="seg burden" role="group" aria-labelledby="'+id("h")+' '+id("b")+'">'+
        BURDEN.map(b=>'<button type="button" data-burden="'+i+'" data-b="'+b+'" aria-pressed="'+(it.burden===b)+'">'+b+'</button>').join("")+'</div></div>'+
      '<label class="f">金額（円）<input type="number" inputmode="numeric" min="0" data-item="'+i+'" data-f="amount" value="'+h(it.amount)+'" placeholder="例：38000"></label></div>';

const WD="日月火水木金土";
/* Japanese public holidays computed from the current holiday law (no network): fixed days, Happy Monday,
   equinoxes (formula valid 1980-2099), substitute holidays and 国民の休日. Special one-off years (e.g. 2019-2021) are not covered */
const holCache={};
function holidaysOf(y){
  if(holCache[y])return holCache[y];
  const H={}, k=(m,d)=>y+"-"+pad(m)+"-"+pad(d);
  const monday=(m,n)=>{const w=new Date(y,m-1,1).getDay();return 1+(8-w)%7+(n-1)*7};
  const eq=c=>Math.floor(c+0.242194*(y-1980)-Math.floor((y-1980)/4));
  [[1,1,"元日"],[2,11,"建国記念の日"],[2,23,"天皇誕生日"],[4,29,"昭和の日"],[5,3,"憲法記念日"],[5,4,"みどりの日"],[5,5,"こどもの日"],[8,11,"山の日"],[11,3,"文化の日"],[11,23,"勤労感謝の日"],
   [1,monday(1,2),"成人の日"],[7,monday(7,3),"海の日"],[9,monday(9,3),"敬老の日"],[10,monday(10,2),"スポーツの日"],[3,eq(20.8431),"春分の日"],[9,eq(23.2488),"秋分の日"]].forEach(([m,d,n])=>H[k(m,d)]=n);
  const named=Object.keys(H);
  for(const s of named){const p=addDays(s,1),q=addDays(s,2);if(H[q]&&!H[p]&&parseYmd(p).getDay()!==0)H[p]="国民の休日"}
  for(const s of named){if(parseYmd(s).getDay()!==0)continue;let n=addDays(s,1);while(H[n])n=addDays(n,1);H[n]="振替休日"}
  return holCache[y]=H;
}
const holidayName=s=>holidaysOf(Number(s.slice(0,4)))[s]||"";
const dayKind=s=>holidayName(s)?"hol":["sun","","","","","","sat"][parseYmd(s).getDay()];

/* Spread each event over the days it covers (all-day "end" is the day after the last day) */
function gcalByDay(j){
  const by={};
  for(const e of (j&&j.events)||[]){
    const allDay=!!e.allDay, st=allDay?parseYmd(e.start):new Date(e.start), en=allDay?parseYmd(e.end):new Date(e.end);
    if(!st||isNaN(st))continue;
    const first=ymd(st);
    let last=allDay?addDays(e.end||first,-1):(en&&!isNaN(en)?ymd(en):first);
    if(!allDay&&en&&!isNaN(en)&&last>first&&hm(en)==="00:00")last=addDays(last,-1);
    if(last<first)last=first;
    for(let d=first,i=0;d<=last&&i<93;d=addDays(d,1),i++){
      const time=allDay||(d>first&&d<last)?"終日":d===first&&d===last?hm(st)+"〜"+hm(en):d===first?hm(st)+"〜":"〜"+hm(en);
      (by[d]=by[d]||[]).push({cal:String(e.calendar||""),title:String(e.title||"（件名なし）"),loc:String(e.location||""),time,sort:allDay?"":time});
    }
  }
  for(const d in by)by[d].sort((a,b)=>a.sort.localeCompare(b.sort));
  return by;
}

  '<div class="sum"><div><div class="k">見積提出</div><div class="v">'+sent.length+'件</div></div><div><div class="k">受注</div><div class="v">'+won.length+'件</div></div><div><div class="k">受注額（見積額）</div><div class="v">'+yen(wonAmt)+'</div></div></div></div></section>'+
  '<section class="sec"><div class="sec-h"><h2>失注の理由</h2></div><div class="panel">'+
    reasons.map(([r,n])=>'<div class="brk"><span>'+r+'</span><span class="bar"><i style="width:'+(n/maxR*100)+'%"></i></span><span class="num">'+n+'件</span></div>').join("")+'</div></section>'+
  '<section class="sec"><div class="sec-h"><h2>依頼の種類別</h2></div><div class="panel"><div class="tbl-wrap"><table class="items" style="min-width:0"><thead><tr><th>種類</th><th>受注</th><th>失注</th></tr></thead><tbody>'+
    byType.map(([l,w,x])=>'<tr><td>'+l+'</td><td class="num">'+w+'件</td><td class="num">'+x+'件</td></tr>').join("")+'</tbody></table></div></div></section>'+
  '<section class="sec"><div class="sec-h"><h2>ToDoの期限（仮）</h2></div><form id="setForm" class="panel">'+
    '<p class="note" style="margin:0">自動で出るToDoの期限日数です。使いながら調整してください。</p>'+
    '<div class="form">'+
    '<label class="f">受付 → 日程調整まで（日）<input type="number" min="0" id="s_schedule" value="'+S.schedule+'"></label>'+
    '<label class="f">現地確認 → 見積提出まで（日）<input type="number" min="0" id="s_quote" value="'+S.quote+'"></label>'+
    '<label class="f">見積提出 → 結論の確認まで（日）<input type="number" min="1" id="s_reply" value="'+S.reply+'"></label>'+
    '<label class="f">受注 → 仕事番号の記録まで（日）<input type="number" min="0" id="s_jobno" value="'+S.jobno+'"></label></div>'+
    '<div class="row"><button class="btn pri" type="submit">保存する</button><span class="sp"></span><button class="btn sm danger" type="button" data-act="reset">すべて消して架空データに戻す</button></div>'+
    (ui.confirmReset?'<div class="ro" role="alert" style="display:flex;flex-direction:column;gap:8px"><b style="color:var(--red)">入力した案件とToDoがすべて消えます。よろしいですか？</b><div class="row"><button class="btn danger" type="button" data-act="resetdo">消して戻す</button><button class="btn" type="button" data-act="resetcancel">やめる</button></div></div>':'')+
    '</form></section>'+
  gSettings();
}
function gSettings(){
  const head='<section class="sec"><div class="sec-h"><h2>Googleカレンダー連携</h2></div>';
  if(!G.cals)return head+'<div class="panel">'+gSyncPanel()+'<p class="note" style="margin:0">「Googleとまとめて同期」でログインすると、表示するカレンダーと登録先を選べます。ログインはアプリを開くたびに必要です（PAPA HUBと同じ）。</p></div></section>';
  const show=new Set(gShowIds()), w=gWriteCal();
  return head+'<form id="gsetForm" class="panel">'+
    '<fieldset class="gcals" style="border:0;padding:0;margin:0"><legend class="note">予定画面に表示するカレンダー</legend>'+
    G.cals.map((c,i)=>'<label><input type="checkbox" name="gshow" value="'+i+'"'+(show.has(c.id)?' checked':'')+'>'+h(c.name)+'</label>').join("")+'</fieldset>'+
    '<label class="f">案件の日程を登録するカレンダー<select id="g_write">'+(gWritable().map(c=>'<option value="'+h(c.id)+'"'+(w&&w.id===c.id?' selected':'')+'>'+h(c.name)+'</option>').join("")||'<option value="">書き込めるカレンダーがありません</option>')+'</select></label>'+
    '<div class="row"><button class="btn pri" type="submit">保存する</button></div></form></section>';
}

const main=document.getElementById("main");
function render(){
  const v={home:vHome,cases:vCases,new:vNew,detail:vDetail,todo:vTodo,cal:vCal,gantt:vGantt,stats:vStats}[ui.view]||vHome;
  main.innerHTML=v();
  const navKey=ui.view==="new"||ui.view==="detail"?"cases":ui.view;
  document.querySelectorAll("[data-nav]").forEach(b=>{if(b.closest("nav"))b.setAttribute("aria-current",b.dataset.nav===navKey?"page":"false")});
  const t=todayS(), n=genTodos().filter(x=>x.due&&x.due<t).length;
  const bd=document.getElementById("todoBadge"); bd.hidden=!n; bd.textContent=n;
  if(ui.view==="gantt"){const gw=main.querySelector(".gwrap");if(gw)gw.scrollLeft=Math.max(0,14*26-120)}
  if(ui.view==="new"){
    const at=document.getElementById("n_at"),d=new Date();at.value=ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
    const ty=document.getElementById("n_type"),sw=document.getElementById("n_symWrap");
    const sync=()=>{sw.hidden=ty.value!=="kinkyu"};ty.addEventListener("change",sync);sync();
  }
}
function go(view,extra){Object.assign(ui,{view,confirmReset:false},extra||{});render();window.scrollTo(0,0)}
let toastT;
function toast(msg,ms){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms||2600)}
const val=id=>{const el=document.getElementById(id);return el?el.value:""};

document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-open]");
  if(!el)return;
  const c=ui.caseId?findCase(ui.caseId):null;
  if(el.dataset.open){go("detail",{caseId:el.dataset.open});return}
  if(el.dataset.nav){const ex={csv:false};if(el.dataset.type)ex.type=el.dataset.type;else if(el.dataset.nav==="cases"&&el.closest(".tile"))ex.type="all";go(el.dataset.nav,ex);return}
  if(el.dataset.type&&ui.view==="cases"){ui.type=el.dataset.type;render();return}
  if(el.dataset.day){ui.calDay=el.dataset.day;ui.calMonth=ui.calDay.slice(0,7);ui.calView="day";render();return}
  if(el.dataset.cv){ui.calView=el.dataset.cv;render();return}
  if(el.dataset.shift!=null){ui.calDay=el.dataset.shift==="today"?todayS():addDays(ui.calDay,el.dataset.shift);ui.calMonth=ui.calDay.slice(0,7);render();return}
  if(el.dataset.mon!=null){const n=Number(el.dataset.mon);if(n===0){ui.calMonth=todayS().slice(0,7);ui.calDay=todayS()}else{const [y,m]=ui.calMonth.split("-").map(Number);const d=new Date(y,m-1+n,1);ui.calMonth=d.getFullYear()+"-"+pad(d.getMonth()+1);ui.calDay=ymd(d)}render();return}
  if(el.dataset.tp){ui.tPeriod=el.dataset.tp;render();return}
  if(el.dataset.tt){ui.tTantou=el.dataset.tt;render();return}
  if(el.dataset.done){const t=DB.todos.find(x=>x.id===el.dataset.done);if(t){t.done=true;save();render();toast("ToDoを完了にしました")}return}
  if(el.dataset.burden!=null&&c){const it=c.items[Number(el.dataset.burden)];if(it){it.burden=el.dataset.b;save();render()}return}
  if(el.dataset.delitem&&c){c.items.splice(Number(el.dataset.delitem),1);save();render();return}
  const a=el.dataset.act;if(!a)return;
  if(a==="new")return go("new");
  if(a==="csv"){ui.csv=true;render();return}
  if(a==="csvclose"){ui.csv=false;render();return}
  if(a==="copycsv"){const ta=document.getElementById("csvOut");const done=()=>toast("コピーしました");
    try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast("選択しました。長押しでコピーしてください")})}catch(err){ta.select();toast("選択しました。長押しでコピーしてください")}return}
  if(a==="reset"){ui.confirmReset=true;render();return}
  if(a==="gsync"){if(!(ui.gsync&&ui.gsync.busy))gSyncAll();return}
  if(a==="resetcancel"){ui.confirmReset=false;render();return}
  if(a==="resetdo"){ui.confirmReset=false;DB=sample();save();for(const k in photos)delete photos[k];toast("架空データに戻しました");go("home");return}
  if(!c)return;
  if(a==="additem"){c.items.push({place:"",state:"",burden:"要確認",amount:""});save();render();
    const f=main.querySelector('[data-item="'+(c.items.length-1)+'"][data-f="place"]');if(f){f.focus();f.scrollIntoView({block:"center"})}return}
  if(a==="greg"&&c){if(ui.gbusy)return;if(!c.planDate){toast("先に日程を決めてください");return}ui.gbusy=true;
    gRegister(c).then(r=>{toast(r==="updated"?"Googleカレンダーの予定を更新しました":"Googleカレンダーに登録しました")},err=>{toast("登録できませんでした："+gMsg(err),5000)}).finally(()=>{ui.gbusy=false;render()});return}
  if(a==="plan"){const d=val("d_plan");if(!d){toast("予定日を入れてください");return}c.planDate=d;save();render();toast(mdh(d)+"に"+TYPES[c.type].site+"の予定を入れました");return}
  if(a==="site"){c.siteDate=val("d_site")||todayS();c.stage="site";save();render();toast(TYPES[c.type].site+"を済みにしました");return}
  if(a==="rushwin"){c.orderDate=todayS();c.stage="won";save();render();toast("受注にしました。Accessへ引き渡してください");return}
  if(a==="quote"){
    if(!(isTaikyo(c)&&c.items.length)){const v=val("d_est");if(v===""){toast("見積額を入力してください");return}c.estAmount=Number(v)}
    if(isTaikyo(c)&&c.items.some(i=>i.burden==="要確認")){toast("負担区分が「要確認」の箇所があります。先に決めてください");return}
    c.estSentDate=val("d_sent")||todayS();c.stage="quoted";save();render();toast("見積を提出済みにしました");return}
  if(a==="win"){c.orderDate=val("d_order")||todayS();c.stage="won";c.holdDate="";save();render();toast("受注にしました。Accessへ引き渡してください");return}
  if(a==="lose"){c.lossReason=val("d_loss");c.lossDate=todayS();c.stage="lost";c.holdDate="";save();render();toast("失注にしました。毎日の一覧から外れます");return}
  if(a==="hold"){const d=val("d_hold");if(!d){toast("次に確認する日を入れてください");return}c.holdDate=d;c.stage="hold";save();render();toast(md(d)+"に再確認のToDoを出します");return}
  if(a==="reopen"){c.stage="quoted";c.lossReason="";c.lossDate="";save();render();return}
  if(a==="hand"){const j=val("d_job").trim();if(!j){toast("Accessで振られた仕事番号を入力してください");return}c.jobNo=j;c.handedDate=todayS();c.stage="handed";save();render();toast("引渡済にしました");return}
  if(a==="csvone"){go("cases",{csv:true});return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.q=t.value;const pos=t.selectionStart;render();const q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(err){}return}
  if(t.type==="date"){const dl=main.querySelector('[data-dl="'+t.id+'"]');if(dl)dl.textContent=mdh(t.value)}
  const c=ui.caseId?findCase(ui.caseId):null;
  if(t.dataset.item!=null&&c){const it=c.items[Number(t.dataset.item)];if(it){it[t.dataset.f]=t.dataset.f==="amount"?(t.value===""?"":Number(t.value)):t.value;save();refreshItemTotals(c)}return}
});
document.addEventListener("change",e=>{
  const t=e.target, c=ui.caseId?findCase(ui.caseId):null;
  if(t.id==="showEnded"){ui.showEnded=t.checked;render();return}
  if(t.dataset.item!=null&&c){const it=c.items[Number(t.dataset.item)];if(it){it[t.dataset.f]=t.dataset.f==="amount"?(t.value===""?"":Number(t.value)):t.value;save();refreshItemTotals(c)}return}
  if(t.id==="d_billing"&&c){c.billingTenant=t.value;save();return}
  if(t.id==="d_photo"&&c){
    const files=[...t.files];photos[c.id]=photos[c.id]||[];
    let left=files.length;
    files.forEach(f=>{const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{const s=Math.min(1,480/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=img.width*s;cv.height=img.height*s;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);photos[c.id].push(cv.toDataURL("image/jpeg",.7));URL.revokeObjectURL(url);if(--left===0)render()};img.onerror=()=>{if(--left===0)render()};img.src=url});
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="newForm"){
    DB.seq=(DB.seq||0)+1;const id="U-"+String(DB.seq).padStart(4,"0");
    const type=val("n_type"),at=val("n_at");
    DB.cases.unshift({id,type,stage:"new",clientKind:val("n_kind"),client:val("n_client").trim(),property:val("n_prop").trim(),room:val("n_room").trim(),addr:val("n_addr").trim(),tantou:val("n_tantou"),
      receivedAt:at?new Date(at).toISOString():new Date().toISOString(),symptom:type==="kinkyu"?val("n_sym"):"",note:val("n_note").trim(),
      items:[],estAmount:null,estSentDate:"",siteDate:"",lossReason:"",lossDate:"",holdDate:"",orderDate:"",jobNo:"",billingTenant:"入居者に直接",handedDate:""});
    save();go("detail",{caseId:id});toast(id+"で受付しました");return}
  if(f.id==="todoForm"){DB.todos.push({id:"T"+Date.now(),title:val("td_title").trim(),due:val("td_due"),tantou:val("td_tantou"),done:false});save();render();toast("ToDoを追加しました");return}
  if(f.id==="gsetForm"){const picked=[...f.querySelectorAll('input[name="gshow"]:checked')].map(x=>G.cals[Number(x.value)]).filter(Boolean).map(c=>c.id);
    DB.settings.gShow=picked;DB.settings.gWrite=val("g_write");for(const x in gcalCache)delete gcalCache[x];save();render();toast("Googleカレンダーの設定を保存しました");return}
  if(f.id==="setForm"){for(const k of ["schedule","quote","reply","jobno"]){const v=Number(val("s_"+k));if(!isNaN(v)&&v>=0)DB.settings[k]=v}save();render();toast("期限の日数を保存しました");return}
});
setInterval(()=>{document.querySelectorAll("[data-since]").forEach(el=>el.textContent=since(el.dataset.since))},30000);
render();
})();
</script>
